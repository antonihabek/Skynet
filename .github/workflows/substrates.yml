# Skynet OS — every driver against the makers' own software, every night, at two versions.
#
# DRY-COVERAGE-PLAN.md Phase 8 item 8.11. No robot will be bought (*Decisions* 18), so the strongest
# evidence a driver here can have is the maker's controller software, the maker's simulator, or an
# independent implementation of the maker's protocol, on the other end of its wire. That evidence
# goes stale in a way nothing else in this repository does: the maker ships a release, and a driver
# that passed against last month's controller software fails against this month's — found by a
# customer, unless something looks first. This is what looks.
#
# Each substrate runs twice. **pinned** is the exact versions each Dockerfile and Makefile names —
# the run a driver's release stage rests on, so a failure there is this repository's (a driver
# change, or a runner that changed under it). **maker-latest** is the same recipe at each maker's
# newest release or branch, so a failure there with pinned green is a vendor change, found the
# night it shipped; the job's summary says which of the two it is.
#
# `tools/check-release-stages.mjs` holds this file to `drivers/models.json`: every driver the
# manifest calls **beta** must be re-run by one of the commands below, or the manifest is refused.
# The EGM row runs here too although its driver is alpha — the controller on the other end of its
# wire is one this repository wrote, from ABB's own message definitions — because a change to
# PickNik's client is still worth finding the night it lands.
#
# Nothing here publishes, uploads or needs a secret. Every image fetches what it builds from the
# makers' public repositories, registries and download servers.

name: substrates

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: substrates
  cancel-in-progress: false

jobs:
  substrate:
    name: ${{ matrix.substrate }} (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: [pinned, maker-latest]
        substrate: [unitree-mujoco, franka-sim, ursim-rtde, ursim-rtde-rs, ursim-ros2-control, drcf, egm, rsi, arcs, x1-sim, lely-canopen, xarm-sim, ardupilot-sitl, px4-sih, lerobot-wire, lerobot-faultvocab, ros2-base-sim, ros2-base-humble, ros2-base-turtlebot3, ros2-base-create3, ros-industrial-sim, reachy-mini-sim, schunk-sim, robotiq-sim, onrobot-oracle, leap-sdk, dobot-sdk, rainbow-sdk]
        include:
          # Unitree's own simulator, unitree_mujoco, for the Go2, B2, H1, G1, H1-2, H2 and R1 (rung 2).
          - substrate: unitree-mujoco
            run: make -C drivers/unitree check-sim-docker
            latest: >-
              SIM_IMAGE=skynet-unitree-sim:maker-latest
              DOCKER_BUILD_ARGS="--build-arg UNITREE_SDK2_REF=main --build-arg UNITREE_MUJOCO_REF=main"
          # franka-sim, an independent FCI server with physics, for both Franka drivers (rung 3).
          - substrate: franka-sim
            run: make -C drivers/franka check-franka-sim-venv
            latest: FRANKA_SIM_VERSION=latest
          # URSim, Universal Robots' controller software, for the RTDE drivers (rung 1). Every model the
          # driver names — UR3e, UR5e, UR10e, UR16e, UR20 and UR30 — one URSim run each, because the row is
          # beta for six arms and this job used to re-measure the UR5 alone (DRY-COVERAGE-PLAN.md 12.A.5).
          - substrate: ursim-rtde
            run: make -C drivers/ur_rtde check-ursim-models
            latest: URSIM_IMAGE=universalrobots/ursim_e-series:latest
          - substrate: ursim-rtde-rs
            run: make -C drivers/ur_rtde-rs check-ursim-docker
            latest: URSIM_IMAGE=universalrobots/ursim_e-series:latest
          # URSim again, for the UR5e behind the ros2_control bridge through UR's own plugin (rung 1).
          - substrate: ursim-ros2-control
            run: make -C drivers/ros2_control check-ursim-docker
            latest: >-
              URSIM_IMAGE=universalrobots/ursim_e-series:latest UR_IMAGE=skynet-ur-ros:maker-latest
              DOCKER_BUILD_ARGS="--build-arg UR_ROS2_DRIVER_REF=jazzy --build-arg UR_CLIENT_LIBRARY_REF=master
              --build-arg UR_DESCRIPTION_REF=jazzy --build-arg UR_MSGS_REF=humble"
          # DRCF, Doosan's controller emulator, for the M0609, M0617, M1013 and M1509 through Doosan's
          # own plugin (rung 1), each against an emulator started as that arm. The emulator's newest
          # tag is looked up at run time (DRCF_NEWEST, below): Doosan publishes versioned tags and
          # no `latest`.
          - substrate: drcf
            run: make -C drivers/ros2_control check-drcf-models
            latest: >-
              DRCF_IMAGE=skynet-doosan-drcf:maker-latest DRCF_EMULATOR=doosanrobot/dsr_emulator:$DRCF_NEWEST
              DOCKER_BUILD_ARGS="--build-arg DOOSAN_ROBOT2_REF=jazzy"
          # PickNik's EGM client against a controller written here from ABB's egm.proto.
          - substrate: egm
            run: make -C drivers/ros2_control check-egm-docker
            latest: >-
              EGM_IMAGE=skynet-abb-egm:maker-latest
              DOCKER_BUILD_ARGS="--build-arg ABB_ROS2_REF=rolling --build-arg ABB_LIBEGM_REF=master
              --build-arg ABB_LIBRWS_REF=master --build-arg ABB_MANAGERS_REF=master"
          # KUKA's own RSI plugin against KUKA's own RSI simulator, for the KR 6 R900 (rung 3: the
          # maker's code on both ends of the wire, with a scripted plant rather than physics). KUKA
          # moves its plugin and its descriptions together, so the latest run opens the URDF its own
          # descriptions built in the image, not the committed one from the pinned release (F138).
          - substrate: rsi
            run: make -C drivers/ros2_control check-rsi-docker
            latest: >-
              RSI_IMAGE=skynet-kuka-rsi:maker-latest RSI_IMAGE_URDF=/opt/kuka_ws/kr6_r900_sixx_rsi.urdf
              DOCKER_BUILD_ARGS="--build-arg KUKA_DRIVERS_REF=master --build-arg KUKA_SDK_REF=master
              --build-arg KUKA_DESCRIPTIONS_REF=master"
          # ARCS, AUBO's controller software with AUBO's simulated arm, for the i5 through AUBO's own
          # plugin (rung 1). Two images with two sets of pins: the installer resolves to the newest
          # on AUBO's server, the plugin and its description to their `main`, and the latest run
          # opens the URDF the image's own description built, as the KUKA row does.
          - substrate: arcs
            run: make -C drivers/ros2_control check-arcs-docker
            latest: >-
              ARCS_IMAGE=skynet-aubo-arcs:maker-latest AUBO_IMAGE=skynet-aubo-ros:maker-latest
              ARCS_IMAGE_URDF=/opt/aubo_ws/aubo_i5_arcs.urdf
              ARCS_BUILD_ARGS="--build-arg ARCS_RUN=latest"
              DOCKER_BUILD_ARGS="--build-arg AUBO_DRIVER_REF=main --build-arg AUBO_DESCRIPTION_REF=main"
          # `ros2_canopen`'s CiA 402 slave on Lely's CANopen stack, on a kernel CAN bus, for both
          # CANopen drivers (rung 3: an independent implementation of CiA 301 and 402, which no
          # drive vendor's own is). The pinned run builds ros2_canopen at 0.3.4; the latest run at
          # `master`. The slave is a mock and the drives it stands for are nobody's.
          - substrate: lely-canopen
            run: make -C drivers/canopen check-lely-docker
            latest: >-
              LELY_IMAGE=skynet-canopen-lely:maker-latest
              DOCKER_BUILD_ARGS="--build-arg CANOPEN_REF=master"
          # UFACTORY's own xArm controller firmware, in the simulator image their support article names,
          # started as each of the five arms the image carries: the xArm 5, xArm 6, Lite 6, 850 and xArm 7
          # (rung 1). The pinned run holds the image by digest and the vendor's SDK at a commit; the latest
          # run takes the image's `latest` tag and the SDK's `master`.
          - substrate: xarm-sim
            run: make -C drivers/xarm check-sim-models
            latest: >-
              XARM_SIM_IMAGE=danielwang123321/uf-ubuntu-docker:latest
              XARM_CLIENT_IMAGE=skynet-xarm-client:maker-latest
              DOCKER_BUILD_ARGS="--build-arg XARM_SDK_REF=master"
          # ArduPilot's own flight code, built for x86 (SITL): a multirotor, a rover, a boat, a fixed wing and a submarine (ArduSub, moved by sticks,
          # with a stop its configuration names) driven through the MAVLink driver, and the reference implementation reading
          # the same vehicles (rung 1). The pinned run builds the commit named in sim/Dockerfile; the latest run
          # builds `master`, so a change in the flight code that this driver depends on is found the night it lands.
          - substrate: ardupilot-sitl
            run: make -C drivers/mavlink check-sim-docker
            latest: >-
              MAVLINK_SIM_IMAGE=skynet-mavlink-sim:maker-latest
              DOCKER_BUILD_ARGS="--build-arg ARDUPILOT_REF=master"
          # PX4's own firmware, the SIH build it publishes as an image (DRY-COVERAGE-PLAN.md 12.E.1): a multirotor, a fixed wing and a rover driven
          # through the MAVLink driver, with the reference implementation reading the same vehicle on PX4's second MAVLink instance (rung 1). The pinned
          # run is the image's digest in sim/run-px4.sh and holds the vehicle's reported build to it; the latest run is PX4's newest image, with the build
          # reported and not compared, so a change in PX4 that this driver depends on is found the night it ships.
          - substrate: px4-sih
            run: make -C drivers/mavlink check-px4-docker
            latest: >-
              PX4_IMAGE=px4io/px4-sitl-sih:latest
              PX4_COMMIT=
          # LeRobot's own SO-101, Koch and OpenMANIPULATOR-X classes, with their own bus code and the makers' own SDKs (Feetech's and ROBOTIS's), on buses of STS3215 and
          # Dynamixel X-series servos emulated here behind pseudo-terminals (rung 4: the makers' whole software stack on one side, a counterpart written here on the
          # other). The pinned run installs the LeRobot release in drivers/lerobot/Makefile; the latest run PyPI's newest, so a LeRobot release that moves its
          # interface (the bridge's one admitted risk, F182) is found the night it ships.
          - substrate: lerobot-wire
            run: make -C drivers/lerobot check-wire-venv
            latest: LEROBOT_VERSION=latest
          # The same two buses held to the fault-vocabulary contract (DRY-COVERAGE-PLAN.md item 12.C.6): every error bit
          # each servo family defines, and codes outside both tables, through the bridge's read and write. Its own venv
          # rather than the wire row's because a matrix row is one job on its own runner; `faultvocab-venv` ends in
          # `make -C drivers/lerobot faultvocab`, which is the command the table's enforcement is.
          - substrate: lerobot-faultvocab
            run: make -C drivers/lerobot faultvocab-venv
            latest: LEROBOT_VERSION=latest
          # ros2_control's own diff_drive_controller on mock hardware, in ROS 2 Jazzy's image, for the ROS 2 base driver (rung 3: the ROS project's implementation of the interface, not any base maker's software), with a second reader of the same base
          # and ROS's own command-line tools for the facts about the graph. The latest run is the ROS distribution after Jazzy that the ROS image publishes as `rolling`, so a
          # change in a controller's topics or message types is found the night it ships.
          - substrate: ros2-base-sim
            run: make -C drivers/ros2_base check-ros-docker
            latest: ROS_DISTRO=rolling
          # The same live block against ROS 2 Humble's controller, which takes a plain Twist (`use_stamped_vel: false`) on another topic: the other kind of subscriber the driver
          # has to find on the graph, which Jazzy's controller no longer has. The image is rebuilt each night from the ROS archive, so the "latest" run picks up whatever the Humble archive then carries.
          - substrate: ros2-base-humble
            run: make -C drivers/ros2_base check-ros-humble-docker
            latest: ROS_DISTRO=humble
          # ROBOTIS's own TurtleBot3 simulation (Gazebo's server, the burger and its bridge) for the ROS 2 base driver (rung 2: the maker's simulator), with Gazebo's own pose of
          # the model as the second opinion. The latest run is the ROS distribution after Jazzy: whether its archive carries `turtlebot3_gazebo` is found the night it does.
          - substrate: ros2-base-turtlebot3
            run: make -C drivers/ros2_base check-tb3-docker
            latest: ROS_DISTRO=rolling
          # iRobot's own Create 3 simulation (Gazebo's server under a virtual display, the maker's spawn, bridges, `motion_control` and `ros2_control` controller) for the ROS 2 base driver
          # (rung 2: the maker's simulator), with Gazebo's own pose of the model as the second opinion. Same `latest` rule as the TurtleBot3's: found the night it exists.
          - substrate: ros2-base-create3
            run: make -C drivers/ros2_base check-create3-docker
            latest: ROS_DISTRO=rolling
          # ROS-Industrial's own simple_message library (industrial_core, cloned at a pinned commit and built without ROS in the image) as a controller's server, in each of its four builds, for
          # the ROS-Industrial driver (rung 3: an independent implementation of the protocol, not any robot maker's controller). The latest run builds the tip of the maker's `melodic-devel`
          # branch, which has not moved since 2023: the night it does, the layout check in the image says what changed.
          - substrate: ros-industrial-sim
            run: make -C drivers/ros_industrial check-sim-docker
            latest: DOCKER_BUILD_ARGS="--build-arg INDUSTRIAL_CORE_COMMIT=melodic-devel"
          # Pollen Robotics' own `reachy-mini-daemon --sim` (the maker's package at a pinned commit, installed with its `mujoco` extra and its Git LFS meshes, headless, no media) behind the
          # maker's own REST interface, for the Reachy Mini driver (rung 2: the maker's simulator), with the maker's own pydantic models, physics and web server's access log as the second opinion.
          # The latest run installs the tip of the maker's `main`, which the pinned commit is today: the night it moves, the layout check in the image says what changed.
          - substrate: reachy-mini-sim
            run: make -C drivers/reachy_mini check-sim-docker
            latest: >-
              REACHY_IMAGE=skynet-reachy-mini-sim:maker-latest
              DOCKER_BUILD_ARGS="--build-arg REACHY_MINI_COMMIT=main"
          # SCHUNK's own `schunk_gripper_dummy` (its protocol simulator of an EGU, EGK or EZU module's web interface, three copies: an EGU 60 and an EGK 25 on EtherNet/IP and an EGU 60 on PROFINET) and its own
          # `schunk_gripper_library` client, both installed at a pinned commit of the maker's repository (GPL-3.0, nothing of it is in this tree), for the SCHUNK driver (rung 2: the maker's simulator). The
          # maker's client is the second opinion on the module and a recorder around the maker's `Dummy.update` is the record of what the driver put on the wire. The latest run installs the tip of the
          # maker's default branch: the night it moves, the layout check in the image says what changed.
          - substrate: schunk-sim
            run: make -C drivers/schunk check-sim-docker
            latest: >-
              SCHUNK_IMAGE=skynet-schunk-sim:maker-latest
              DOCKER_BUILD_ARGS="--build-arg SCHUNK_COMMIT=HEAD"
          # Robotiq's own C++ SDK (`Robotiq/grippers`, BSD-3-Clause) at a pinned commit, built in the image unmodified with four small programs against it: its own fake gripper (`fake::RegisterModel` behind
          # `fake::GripperServer`) on a TCP port and a pseudo-terminal, its own client reading the same gripper and driving the simulated one, and the dump of what its client writes. For the Robotiq driver (rung 2:
          # the maker's simulator). The latest run builds the tip of the maker's default branch: the night it moves, the layout check in the image says what changed.
          - substrate: robotiq-sim
            run: make -C drivers/robotiq check-sim-docker
            latest: >-
              ROBOTIQ_IMAGE=skynet-robotiq-sim:maker-latest
              DOCKER_BUILD_ARGS="--build-arg ROBOTIQ_COMMIT=HEAD"
          # OnRobot's own client library (`libonrobot_tool_api`, BSD-3-Clause), fetched from the maker's GitHub release and run as the oracle this driver's registers are held to (rung 3: the maker's own implementation of
          # the protocol, with a gripper written here on the other end; OnRobot publish no register table and no simulator). The pinned run takes release 1.2.0 by the SHA-256 in sim/fetch.sh; the latest run takes the
          # newest release the maker has published, which is then not checked against a pin: the night its API or its registers move, the oracle's build or the layout check says what changed.
          - substrate: onrobot-oracle
            run: make -C drivers/onrobot check-oracle-docker
            latest: >-
              ONROBOT_IMAGE=skynet-onrobot-oracle:maker-latest
              ONROBOT_RELEASE=latest
          # ROBOTIS's own SDK for the hand's servos (`dynamixel_sdk`, Apache-2.0), installed from PyPI in the image, and LeRobot's control table for the same servos, run against the LEAP Hand driver's simulated hand
          # (rung 3: the maker's own client of the servos' protocol, with a hand written here on the other end; the hand has no controller). The pinned run takes SDK 4.1.0 by hash and the table at a pinned commit;
          # the latest run takes the newest SDK and the tip of LeRobot's default branch, so the night a packet rule or a register moves, the layout check says what changed.
          - substrate: leap-sdk
            run: make -C drivers/leap check-sdk-docker
            latest: >-
              LEAP_IMAGE=skynet-leap-sdk:maker-latest
              DYNAMIXEL_SDK=latest
              DOCKER_BUILD_ARGS="--build-arg LEROBOT_COMMIT=HEAD"
          # Dobot's own Python client for the V4 controllers (`Dobot-Arm/TCP-IP-Python-V4`, MIT), fetched at a pinned commit by its SHA-256, with numpy (which the client reads the feedback packet through) installed by hash,
          # run against the Dobot driver's simulated controller (rung 3: the maker's own client of the controller's text and packet ports, with a controller written here on the other end; Dobot publish a document of the
          # interface and no simulator that runs without a licence). The latest run takes the newest numpy and the tip of the client's default branch, which is then not checked against a pin: the night its text or its packet
          # moves, the layout check says what changed.
          - substrate: dobot-sdk
            run: make -C drivers/dobot check-sdk-docker
            latest: >-
              DOBOT_IMAGE=skynet-dobot-sdk:maker-latest
              DOBOT_NUMPY=latest
              DOCKER_BUILD_ARGS="--build-arg DOBOT_SDK_COMMIT=main"
          # Rainbow Robotics' own client for its control boxes, `rbpodo` (Apache-2.0), fetched at a pinned commit by its SHA-256 and built in the image (CMake and a C++17 compiler; the build fetches Eigen and pybind11 by the
          # hashes rbpodo's own CMake files pin), with numpy installed by hash, run against the Rainbow driver's simulated control box (rung 3: the maker's own client of the control box's script and packet ports, with a control
          # box written here on the other end; Rainbow publish the control box's software as a virtual machine to its customers and no simulator that runs here without it, which `drivers/rainbow/vm_check.py` was run against by hand).
          # The latest run takes the tip of the client's default branch, which is then not checked against a pin, and the newest numpy: the night its text or its packet moves, the layout check says what changed.
          - substrate: rainbow-sdk
            run: make -C drivers/rainbow check-sdk-docker
            latest: >-
              RBPODO_IMAGE=skynet-rainbow-sdk:maker-latest
              RBPODO_COMMIT=main
          # AgiBot's own agibot_x1_infer deployment and its MuJoCo sim (rung 2).
          - substrate: x1-sim
            run: make -C drivers/x1 check-sim-docker
            latest: >-
              SIM_IMAGE=skynet-x1-sim:maker-latest
              DOCKER_BUILD_ARGS="--build-arg X1_INFER_REF=main"
    steps:
      - uses: actions/checkout@v7

      # The images are several gigabytes each and the runner's disk is not. What goes is toolchains
      # nothing here uses.
      - name: Make room for the images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h / | tail -1

      # A container cannot load a kernel module, so `vcan` has to come from the runner's kernel. The
      # image creates the interface itself, in its own network namespace.
      - name: Load vcan
        if: ${{ matrix.substrate == 'lely-canopen' }}
        run: |
          sudo modprobe vcan || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
            sudo modprobe vcan
          }
          lsmod | grep '^vcan'

      - name: Find DRCF's newest tag
        if: ${{ matrix.substrate == 'drcf' && matrix.version == 'maker-latest' }}
        run: |
          newest=$(curl -sSf "https://hub.docker.com/v2/repositories/doosanrobot/dsr_emulator/tags?page_size=25&ordering=last_updated" \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['results'][0]['name'])")
          echo "DRCF's newest tag is $newest"
          echo "DRCF_NEWEST=$newest" >> "$GITHUB_ENV"

      - name: ${{ matrix.run }}
        run: |
          if [ "${{ matrix.version }}" = maker-latest ]; then
            eval "${{ matrix.run }} ${{ matrix.latest }}"
          else
            ${{ matrix.run }}
          fi

      # The committed Doosan URDFs are what `doosan/generate.py` writes from the vendor's own xacro in the
      # image, for every arm but the hand-made M1013. It needs the image this job has just built and no
      # emulator, so it rides here on the pinned run and nowhere else; nothing else ran it
      # (DRY-COVERAGE-PLAN.md 12.A.5).
      - name: Doosan's committed descriptions are what the generator writes
        if: ${{ !cancelled() && matrix.substrate == 'drcf' && matrix.version == 'pinned' }}
        run: make -C drivers/ros2_control check-doosan-urdfs

      - name: Say which kind of failure this is
        if: ${{ failure() }}
        run: |
          if [ "${{ matrix.version }}" = pinned ]; then
            echo "### ${{ matrix.substrate }} failed at its pins" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing the maker ships moved under this run. Either a change in this repository broke the driver, or the runner changed; the pinned run is what the driver's release stage rests on, so drivers/models.json is wrong until this is green." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ${{ matrix.substrate }} failed at the maker's latest" >> "$GITHUB_STEP_SUMMARY"
            echo "If the pinned job of the same substrate passed tonight, the maker's newest release changed something this driver depends on. Read the log for what, then move the pin or fix the driver — never loosen the check." >> "$GITHUB_STEP_SUMMARY"
          fi
