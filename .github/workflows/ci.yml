# Skynet OS — continuous integration.
#
# Four jobs, and the third is the one that matters. §31.4 requires differential checking in CI:
# every edition runs the corpus on every commit, and a divergence blocks the release of the edition
# that diverged and never of the others. Today there is one edition, so `corpus` is the whole of
# that mechanism; when a second lands it becomes a matrix over editions and nothing else changes.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The Rust reference edition. No third-party dependencies anywhere in the workspace, so there is
  # nothing to cache and nothing to audit — which is a property worth keeping.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace

      # The daemon, against the machine rather than against a model. `skynetd-io`'s suite proves
      # the store and the reconciler over a temporary directory; this proves the pieces fit: a
      # package is staged, verified, activated through a symlink, launched as a transient systemd
      # unit under its declared cgroup limits, and driven through a Unix socket by the CLI.
      #
      # The launch step needs a systemd manager. Where there is one the run is *required* to reach
      # it, so a runner that quietly lost systemd fails the job rather than passing a shorter exam —
      # which is the failure mode §15 spends a whole rule on, and which this repository has already
      # found in its own CI once.
      - name: The daemon, end to end
        run: |
          cargo build -p skynetd-io -p skynet-cli
          if systemd-run --user --unit=skynet-ci-probe --collect /bin/true 2>/dev/null; then
            echo "a user systemd manager is here; the launch step is required to run"
            export SKYNET_REQUIRE_SYSTEMD=1
          else
            echo "::warning::no user systemd manager on this runner — the launch step will be reported as not run"
          fi
          SKYNET_BIN=target/debug sh crates/skynetd-io/e2e.sh

      # The kernel builds for a bare-metal target with no operating system under it. This is the
      # certified tier's argument made mechanical: one source, two targets, and if the kernel ever
      # acquires a dependency on `std` or an allocator, this is where it is caught rather than in a
      # safety review a year later.
      - name: Kernel builds for a safety MCU
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo build -p skynet-kernel --target thumbv7em-none-eabihf

  # The vendor-facing ABI. A driver author reads these headers before deciding whether the platform
  # is worth an afternoon, so they must compile cleanly from both C and C++.
  abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mock robot, sim conformance
        working-directory: drivers/mock
        run: make check
      - name: The C++ wrapper still compiles
        working-directory: drivers/mock
        run: make cpp-header-check

      # The Python binding is the third view of the same ABI (§31.2). Its ctypes structs assert the
      # same offsets the Rust crate and the mock assert from their side, so a layout that moves
      # fails three suites rather than making one robot behave oddly.
      - name: The Python ABI view matches the header
        run: PYTHONPATH=bindings/python python3 -c "import skynet_rhal; skynet_rhal.assert_abi_layout()"

      # The LeRobot bridge, against its fake. This is the whole of what can be verified without the
      # library installed, and the harness says so on every run rather than implying more.
      - name: LeRobot bridge, sim conformance
        working-directory: drivers/lerobot
        run: make check PYTHON=python3
      # The C header is the ABI. Anything that stops it being includable from plain C99 — a C11-only
      # construct, a compiler extension — narrows who can implement a driver.
      - name: The C header is C99-includable
        run: |
          printf '#include "skynet_rhal.h"\nint main(void){return 0;}\n' > /tmp/c99.c
          cc -std=c99 -Wall -Wextra -Wpedantic -Ibindings/c -o /tmp/c99 /tmp/c99.c

      # §63.5's first milestone, measured rather than asserted: a fresh scaffold compiles clean,
      # loads through dlopen, and reaches guest tier with exactly the two blockers its own README
      # names. It lives here rather than in the `rust` job because it needs a C compiler, and it is
      # `#[ignore]`d by default so that running it is a scheduling decision rather than a silent
      # skip on a machine that happens to lack one.
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - name: A fresh scaffold builds, loads and reaches guest tier
        run: cargo test -p skynet-cli -- --ignored --nocapture

      # The whole Python path, end to end and on the POSIX side of the host — which is the half that
      # cannot be exercised on the machine it was written on. `skynet driver check` dlopens the C
      # host, which forks an interpreter, which serves the LeRobot bridge over a pipe.
      - name: A Python driver loads through the host and reaches guest tier
        working-directory: drivers/python-host
        run: make check PYTHON=python3

      # The MuJoCo simulator driver (§70), against real physics. `libosmesa6` is the software GL
      # implementation that makes the camera path exercisable on a machine with no display; without
      # it the driver correctly declares no sensors, which is a real branch and a weaker test.
      - name: MuJoCo
        run: |
          python3 -m pip install --quiet mujoco
          sudo apt-get update -qq && sudo apt-get install -y -qq libosmesa6
      - name: MuJoCo driver, sim conformance against physics
        working-directory: drivers/mujoco
        run: MUJOCO_GL=osmesa make check PYTHON=python3
      - name: And the same driver through the C host
        working-directory: drivers/python-host
        run: MUJOCO_GL=osmesa make check-mujoco PYTHON=python3

  # The corpus, and the property that makes multiple editions survivable.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal

      # Regenerating must be a no-op. If it is not, the reference implementation's behaviour changed
      # without the corpus being updated in the same commit — which is precisely the state §31.4
      # forbids, because it means the editions are being measured against a stale specification.
      - name: The corpus is up to date with the reference
        run: |
          node tools/corpus-gen/generate.ts
          git diff --exit-code --stat corpus/ || {
            echo "::error::The reference implementation's behaviour changed and corpus/ was not regenerated."
            echo "Run: node tools/corpus-gen/generate.ts, and review the diff as the specification change it is."
            exit 1
          }

      # Every edition sits the same exam. One row today.
      - name: Rust edition reproduces the corpus
        run: cargo test -p skynet-corpus -- --nocapture

  # Claims this repository makes about itself, checked mechanically. Each of these is a sentence
  # somewhere in the specification that would otherwise decay quietly.
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # §32.2. The console's script is `include_str!`'d, which means Rust sees a string: a missing
      # brace compiles, ships, serves with a 200, and produces a blank page on a robot with every
      # test in `console.rs` still green. This is the only check that can catch it, and a blank
      # console is a robot whose stop button is gone.
      - name: The console's script parses
        run: node --check crates/skynetd-io/console/console.js

      - name: The console fixture's server parses
        run: node --check crates/skynetd-io/console/fixture-serve.mjs

      # §72.1 splits the code and does not split the specification, and §31.4 makes the reference
      # TypeScript the oracle every edition is measured against. Both checks are **no-ops when
      # BotMarket is not checked out beside this one**, which is the case in this workflow today and
      # the reason they are cheap to have: they become real for anybody working with both trees, and
      # for a future job that checks out both.
      #
      # The contract check exists because the docs stayed in sync for thirteen sessions while
      # `lib/skynet/os/safety.ts` fell six behind, and nothing could see it: the corpus holds the
      # Rust edition and the reference to each other, and the Hub's copies are outside it.
      - name: The shared documents and contracts have not diverged
        run: |
          node tools/check-mirrors.mjs
          node tools/check-contract-mirrors.mjs

      # §7.4. The sentence the product is not allowed to shorten. It lives in the kernel as a
      # constant, and a surface that mentions the certified tier without it is a surface making a
      # claim nobody sanctioned.
      - name: The safety claim rule is intact
        run: |
          grep -q "It does not certify a machine" crates/skynet-kernel/src/lib.rs
          grep -q "performed by a notified" crates/skynet-kernel/src/lib.rs

      # §8.3. A policy is always sandboxed — no flag, no override. An escape hatch here would
      # quietly undo the invariant the whole safety argument rests on.
      - name: Only a driver may run native
        run: grep -q 'manifest.kind != "driver" && manifest.isolation == "native"' crates/skynet-contracts/src/admission.rs

      # §23.1. "This never allocates" is a compile-time property or it is a promise, and a promise
      # is what code review produces on a good day.
      - name: The kernel links no allocator
        run: |
          grep -q '#!\[no_std\]' crates/skynet-kernel/src/lib.rs
          ! grep -q 'extern crate alloc' crates/skynet-kernel/src/lib.rs

      # §63.4. The line the URDF importer exists to hold: a URDF effort limit is a design value from
      # a CAD model, not a datasheet safety rating, and no flag may turn one into the other. The
      # rule is a property of the code rather than of a default, so the check is that the emitter
      # writes a literal null and nothing else can reach the field.
      - name: A generated descriptor never carries an envelope
        run: |
          grep -q '\.set("envelope", Json::Null)' crates/skynet-urdf/src/descriptor.rs
          if grep -n 'set("envelope"' crates/skynet-urdf/src/descriptor.rs | grep -v 'Json::Null'; then
            echo "::error::skynet-urdf writes an envelope from somewhere other than a literal null."
            echo "§63.4: a URDF carries design values, not sourced safety ratings. Populating the"
            echo "envelope from a model figure is the 'invent a plausible number' failure the whole"
            echo "design exists to prevent."
            exit 1
          fi

      # §35.3 and §70. A simulator declares itself one, and the declaration has to *do* something
      # or it is a comment. The cap lives in the contracts and in the CLI's tier walk, and the
      # corpus holds both to the oracle's answers; this is the check that the rule was not quietly
      # removed from either place while the corpus cases were removed with it.
      - name: A simulated body is capped at guest
        run: |
          grep -q 'input.simulator && (best == "host" || best == "certified")' \
            crates/skynet-contracts/src/certification.rs
          grep -q 'self.simulated && tier_rank(attained) > tier_rank("guest")' \
            crates/skynet-cli/src/check.rs

      # §23.1 again, from the other side. Two crates cannot be safe by construction: `skynet-rhal`
      # declares a C vtable of raw function pointers, and `skynet-cli` loads arbitrary native code.
      # Every other crate can be, and stays that way.
      - name: Everything but the ABI and the loader forbids unsafe
        run: |
          for crate in skynet-json skynet-sha256 skynet-ed25519 skynet-kernel skynet-contracts skynet-urdf skynetd skynetd-io skynet-blackbox; do
            grep -q 'forbid(unsafe_code)' "crates/$crate/src/lib.rs" || {
              echo "::error::crates/$crate dropped forbid(unsafe_code)."
              exit 1
            }
          done

      # §33.1. `skynetd` is not safety-critical and is built that way: it never touches an
      # actuator, and that single property is what licenses it to be a large, allocating,
      # network-facing program. A dependency edge to the hardware abstraction layer is the first
      # step in quietly acquiring the ability to write a joint, so the edge is asserted absent
      # rather than remembered absent.
      - name: skynetd cannot reach the RHAL
        run: |
          # Both halves. §33.1 is a property of the *daemon*: "it never touches an actuator" stops
          # being true the moment either crate can, and the I/O half is the one that can actually
          # open things.
          #
          # A dependency *line*, not the word: both manifests explain at length why the edge
          # is absent, and a check that a comment saying "not skynet-rhal" trips is a check
          # that punishes writing the reason down.
          # `skynet-blackbox` is in the list because `skynetd-io` depends on it, and a transitive
          # edge reaches an actuator exactly as well as a direct one. The black box records
          # `rhal_state` (§26), so the crate that declares those structs is the obvious dependency
          # to take and the one that would quietly restore what §33.1 removed.
          for crate in skynetd skynetd-io skynet-blackbox; do
            if grep -qE '^[[:space:]]*skynet-rhal[[:space:]]*=' "crates/$crate/Cargo.toml"; then
              echo "::error::$crate took a dependency on skynet-rhal."
              echo "§33.1: skynetd is not safety-critical *because* it never touches an actuator."
              echo "Everything else in §33 — the reconciler, the network exposure, the JSON parser —"
              echo "is licensed by that property, and this edge is how it would be lost."
              exit 1
            fi
            # The identifier in *code*, not in prose. The manifests and the modules explain at
            # length why the edge is absent, and a check that trips on a comment saying "not
            # skynet-rhal" is a check that punishes writing the reason down — which is how the
            # reason stops being written down.
            if grep -rnE 'skynet_rhal' "crates/$crate/src/" | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|[*])'; then
              echo "::error::$crate names skynet_rhal outside a comment."
              exit 1
            fi
          done

      # §33.3's two claims — converges from any starting state, idempotent — are properties of a
      # *function*. They are only assertable because `skynetd` is pure, so the purity is asserted
      # rather than remembered: the brain does not read a clock, open a socket, spawn a process or
      # touch the filesystem. Everything that does lives in `skynetd-io`.
      - name: The reconciler stays a pure function
        run: |
          if grep -rnE 'std::(fs|net|process|thread)|SystemTime|Instant::now|std::os::' crates/skynetd/src/; then
            echo "::error::skynetd reached for I/O."
            echo "§33.3 claims the reconciler converges from any starting state and is idempotent."
            echo "Those are properties of a function; about a program that also talks to systemd"
            echo "they are a hope. The I/O half is crates/skynetd-io."
            exit 1
          fi

      # §13 and §41.1. The black box's guarantee is completeness, and the shape of that guarantee is
      # that a window with a hole in it *says so* rather than being refused. Sealing an incomplete
      # recording must stay possible: the recording most likely to have a hole in it is the one
      # covering the fault that made the hole, and refusing to produce it would destroy the only
      # evidence at the moment it is worth something.
      - name: An incomplete recording is still sealed, and still says it is incomplete
        run: |
          grep -q 'pub fn complete' crates/skynet-blackbox/src/seal.rs
          if grep -nE 'return .*(Err|None).*incomplete|if !continuity.complete\(\)' \
              crates/skynet-blackbox/src/seal.rs; then
            echo "::error::seal() grew a path that refuses an incomplete window."
            echo "§41.1: the guarantee is 'complete, or the run is not conformant' — which is a"
            echo "statement about conformance, not a licence to withhold the evidence."
            exit 1
          fi

      # §41.1's other half, from the direction it would actually be lost. The event vocabulary is a
      # closed enum so that ordinary logging cannot reach the black box; an open one — a free string
      # subject, a formatted message as a code — is how a recorder becomes a log file and the
      # completeness guarantee stops meaning anything.
      - name: The black box event vocabulary stays closed
        run: |
          grep -q 'pub enum EventCode' crates/skynet-blackbox/src/record.rs
          grep -q 'A closed enum rather than a free string' crates/skynet-blackbox/src/record.rs

      # §31.2 and §7.4. The kernel's sine, cosine and square root are the specification's, not the
      # platform's, and the whole certified-tier argument for mirroring this kernel onto a second
      # processor rests on that. A `use std::f64` or a call into a math library here would make two
      # editions — and the two channels of a redundant pair — disagree about a clamp, and the
      # disagreement would present as a specification dispute rather than as a build change.
      - name: The kernel computes its own transcendentals
        run: |
          grep -q 'pub fn sin' crates/skynet-kernel/src/real.rs
          grep -q 'pub fn cos' crates/skynet-kernel/src/real.rs
          grep -q 'pub fn sqrt' crates/skynet-kernel/src/real.rs
          if grep -rnE '\.(sin|cos|sqrt|tan|atan2|hypot)\(' crates/skynet-kernel/src/ \
              | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|[*])' \
              | grep -vE 'crates/skynet-kernel/src/real\.rs'; then
            echo "::error::the kernel reached for a platform math function."
            echo "§31.2: sin, cos and sqrt are single-source across editions. ECMAScript permits"
            echo "Math.sin an implementation-defined error and every libm rounds its own way, so a"
            echo "pose computed through one would diverge from a pose computed through another —"
            echo "including between the two channels of a certified-tier pair."
            exit 1
          fi
          # And the second edition implements the same routine rather than calling the platform's.
          if grep -nE 'Math\.(sin|cos|sqrt)\(' reference/typescript/kinematics.ts; then
            echo "::error::the reference edition called Math.sin, Math.cos or Math.sqrt."
            exit 1
          fi

      # §7.2, from the direction it would actually be lost. The pose guards ask the frame graph for
      # evidence — volumes that name reachable frames, two or more placeable collision shapes — and
      # never a descriptor's own claim that it has a collision model. A boolean is a claim, and a
      # guard reported as running because a document asserted it could is the most damaging form of
      # the failure §7.2 exists to prevent.
      - name: The pose guards ask for evidence and not for a claim
        run: |
          if grep -nE 'available\.(solvers|collision_model)' crates/skynet-kernel/src/lib.rs; then
            echo "::error::a pose guard is gated on a descriptor's self-assessment again."
            echo "§7.2: the frame graph is the evidence. `collision_model: true` with no geometry"
            echo "in it produced a guard reported as active that had nothing to evaluate, and"
            echo "`solvers` named an inverse-kinematics solver for a guard that does forward"
            echo "kinematics (§44.2)."
            exit 1
          fi
          grep -q 'embodiment.frames\[\].collision, on two or more frames' crates/skynet-kernel/src/lib.rs

      # §44.5. A frame below a ball or floating joint can never be placed from one scalar per joint,
      # and that is knowable when the lease is granted. Losing the static check turns "the guard
      # reported itself unavailable, naming the frame" into "the robot holds still every cycle for
      # the life of the lease" — the same outcome with the reason removed.
      - name: Unreachable frames are refused at lease time, not every cycle
        run: |
          grep -q 'pub fn statically_resolvable' crates/skynet-kernel/src/kinematics.rs
          grep -q 'statically_resolvable' crates/skynet-kernel/src/lib.rs

      # §31.4, and the lesson of this repository's own blind spot. Two of the eight guards were
      # implemented in one edition and absent from the other for four sessions, and nothing caught
      # it because no corpus *input* carried a capability token or a separation distance. A corpus
      # grows a hole wherever an input field is missing, not only where an implementation is.
      - name: Every guard the kernel implements appears in the corpus
        run: |
          for field in capability nearest_person_m; do
            grep -q "$field" corpus/fuzz/cycle.json || {
              echo "::error::no corpus case supplies $field, so the guard reading it is pinned by"
              echo "one edition's own suite and by nothing else — the arrangement §31.4 prevents."
              exit 1
            }
          done
          # Matched inside the `tripped` list of an expected verdict, not anywhere in the file:
          # `workspace` also names a profile setting in the *input*, and a check satisfied by the
          # question rather than by the answer is the shape of blind spot this step exists to close.
          for guard in workspace self_collision proximity mode_gate; do
            grep -rq "tripped[^]]*$guard" corpus/cycle/ || {
              echo "::error::no cycle case trips $guard."
              exit 1
            }
          done

      # §38.1, and the hole Ed25519 closed. The desired state is a file on the robot's own disk —
      # which is exactly where §38.1 puts the attacker, "somebody editing limits on a robot's disk"
      # — so a document that could assert its own `"verified": true` let anybody who could raise the
      # kernel's ceilings also raise the claim that somebody had checked them. The decoder must
      # never read that key; only a signature verified on the robot may set it.
      - name: A profile cannot assert its own verification
        run: |
          if grep -nE 'get\("verified"\)|string\(raw, "verified"\)' crates/skynetd/src/desired.rs; then
            echo "::error::the desired-state decoder read a `verified` key from the document."
            echo "§38.1: the interesting attacker is somebody editing limits on the robot's disk,"
            echo "and the desired state is on the robot's disk. The verdict is skynetd-io's, from"
            echo "the signature and the trust store, and never the document's own claim."
            exit 1
          fi
          grep -q 'fn verify_profile' crates/skynetd-io/src/runtime.rs

      # §19. "A driver runs native and must therefore be signed by a key the operator has trusted."
      # The gate is at activation, because a staged blob is inert and the symlink swap is the
      # consequential moment. Losing it would leave a report that says `signature_untrusted` next to
      # a robot that loaded the code anyway.
      - name: A driver does not activate without a trusted signature
        run: |
          grep -q 'fn driver_signature_refusal' crates/skynetd-io/src/runtime.rs
          grep -q 'driver_signature_refusal' crates/skynetd-io/src/runtime.rs
          # The refusal is reached from the activation arm, not merely defined.
          grep -A4 'ActionKind::ActivatePackage' crates/skynetd-io/src/runtime.rs \
            | grep -q 'driver_signature_refusal' || {
              echo "::error::ActivatePackage no longer consults §19's driver signature gate."
              exit 1
            }

      # §38.3. The trust store is written back by `skynetd trust`, and a rewrite that dropped what
      # it could not parse would make adding a key a way to delete the entry somebody is trying to
      # find. The store therefore keeps every unusable line verbatim and re-emits it in place.
      - name: A trust store rewrite preserves what it could not parse
        run: |
          grep -q 'raw: entry.clone()' crates/skynetd-io/src/trust.rs
          grep -A6 'pub fn to_json' crates/skynetd-io/src/trust.rs \
            | grep -q 'Entry::Skipped(skipped) => skipped.raw.clone()' || {
              echo "::error::TrustStore::to_json no longer re-emits skipped entries."
              echo "§38.3: an audited surface that silently drops a malformed key turns"
              echo "\`skynetd trust add\` into a way to lose one."
              exit 1
            }

      # §38.3, the other half: provenance is *recorded*, never inferred. A key added without
      # `--by` records nobody rather than whatever `\$USER` happens to say, because an environment
      # variable is not an identity and a confidently wrong provenance is worse than an absent one.
      - name: Provenance is never guessed from the environment
        run: |
          if grep -rnE 'env::var\("(USER|SUDO_USER|LOGNAME|USERNAME)"\)' crates/skynetd-io/src/; then
            echo "::error::something read a username out of the environment for an audit record."
            echo "§38.3 wants who and when. A name nobody typed is a provenance nobody wrote."
            exit 1
          fi
          grep -q '"unattributed"' crates/skynetd-io/src/main.rs

      # §32.2. The console has to render on a phone held next to a robot, and `main` is a grid:
      # a grid item's default `min-width: auto` means one wide table sets the width of every panel
      # beside it, which is how a page that looked fine on a laptop pushed 378 px off the right
      # edge of a phone — with the *status* panel among the things hanging over it. A page that
      # scrolls sideways puts the stop button's own row off screen.
      - name: The console cannot be widened by one panel
        run: |
          grep -q 'main > \* { min-width: 0; }' crates/skynetd-io/console/console.css
          grep -q 'overflow-x: auto' crates/skynetd-io/console/console.css

      # §48.2. A check that could not run has not passed. The self-test has four outcomes and only
      # one of them is a licence: `may_run` is true when **every** check passed, and a refactor that
      # counted `unavailable` or `elsewhere` as "not a failure, therefore fine" would produce a
      # robot cleared to run a policy on the strength of three checks out of eight.
      - name: A self-test that could not run is not a self-test that passed
        run: |
          grep -A4 'pub fn may_run' crates/skynetd-io/src/post.rs \
            | grep -q 'check.outcome == Outcome::Pass' || {
              echo "::error::POST's may_run no longer requires every check to have passed."
              echo "§48.2: an unavailable check establishes nothing, and a check §33.1 forbids this"
              echo "process from running has not been run by anybody it can ask."
              exit 1
            }
          # And the two verdicts stay apart: SAFE is sticky and needs a human, incomplete does not.
          grep -q '"post_incomplete"' crates/skynetd-io/src/post.rs
          grep -q 'fn an_undeclared_window_leaves_post_incomplete_rather_than_failed' \
            crates/skynetd-io/src/tests.rs

      # §46.2, and the shape of the rule is what a refactor would flatten. A tier ladder normally
      # caps downward; here the **middle rung is the unsafe one**. A body whose drives coast may be
      # guest (enforcement is advisory) and may be certified (layer 4 cuts drive enable
      # independently of the reset), and only host — where layer 3 is the last line and its recovery
      # is resetting the processor — turns a watchdog reset into a fall. Rewriting this as a ceiling
      # would silently permit exactly the configuration it exists to refuse.
      - name: A coasting body is refused host and nothing else
        run: |
          grep -q 'fn host_blocked_by_command_loss' crates/skynet-contracts/src/watchdog.rs
          grep -q 'Some("coast") => Some' crates/skynet-contracts/src/watchdog.rs
          # Silence is not `hold`: an undeclared behaviour blocks host too.
          grep -A3 'None => Some(' crates/skynet-contracts/src/watchdog.rs \
            | grep -q 'does not declare what its drives do' || {
              echo "::error::an undeclared on_command_loss no longer blocks the host tier."
              echo "§46.2: silence is a recovery path nobody has characterised, not \`hold\`."
              exit 1
            }
          grep -q 'fn a_coasting_body_is_refused_host_and_nothing_else' \
            crates/skynet-contracts/src/watchdog.rs

      # §46.3. Two watchdogs with the same window is a race decided by interrupt latency, and a
      # chain whose order depends on which timer fires first is not a chain. The comparison is
      # strict, and an undeclared window is reported rather than skipped — a nesting report that
      # ignored the window it could not get would be reporting on a chain it had not established.
      - name: The watchdog windows nest strictly
        run: |
          grep -q 'if inner < outer {' crates/skynet-contracts/src/watchdog.rs
          grep -q 'fn equal_windows_do_not_nest' crates/skynet-contracts/src/watchdog.rs
          grep -q 'fn a_gap_is_reported_and_skipped_over_rather_than_ending_the_check' \
            crates/skynet-contracts/src/watchdog.rs

      # §34.4. An incident is never dropped, which is only true if there is somewhere to put it —
      # so the budget is split and the reserve is untouchable. The two ways this silently breaks
      # are an incident drawing on the shared pool (it would then be evictable in practice) and
      # `victim()` being allowed to evict upwards, which would let a flood of telemetry take out
      # the incident it is supposed to make room beside.
      - name: An incident is never dropped to make room
        run: |
          grep -q 'fn droppable' crates/skynetd-io/src/outbound.rs
          grep -q 'self != Class::Incident' crates/skynetd-io/src/outbound.rs
          # The eviction candidate must be at least as droppable as the item asking for room.
          grep -q 'item.class.droppable() && item.class >= class' crates/skynetd-io/src/outbound.rs
          grep -q 'fn an_incident_fits_into_a_queue_that_is_otherwise_full' \
            crates/skynetd-io/src/outbound.rs
          grep -q 'fn telemetry_never_evicts_an_episode' crates/skynetd-io/src/outbound.rs

      # §34.4's jitter, which only does its job in the full form. `exponential ± 10%` leaves a
      # hundred robots that lost the same access point retrying inside the same tenth of a window —
      # the thundering herd smeared rather than broken up. The delay must be uniform over
      # [0, exponential], and the cap must survive a jitter nobody clamped.
      - name: Backoff jitter is full and the cap holds
        run: |
          grep -q 'jitter.clamp(0.0, 1.0)' crates/skynetd-io/src/outbound.rs
          grep -q 'min(BACKOFF_CAP_MS)' crates/skynetd-io/src/outbound.rs
          grep -q 'backoff_ms(12, 4.0), BACKOFF_CAP_MS' crates/skynetd-io/src/outbound.rs

      # §45.5. An expired calibration disables its dependent guards **by name**. The naming is the
      # whole requirement: "proximity unavailable" sends nobody anywhere, and "proximity
      # unavailable: the camera_extrinsics calibration expired" sends them to a target board. The
      # table that maps a parameter set to the guards it feeds is §45.2's deliverable, and a guard
      # spelled wrongly in it disables nothing while reading as though it disabled something.
      - name: Every calibrated parameter set names real guards
        run: |
          grep -q 'fn the_guard_table_names_only_guards_the_kernel_has' \
            crates/skynet-contracts/src/calibration.rs
          # Absence is not validity: a set nobody measured takes its guards with it.
          grep -q 'None => Validity::Absent' crates/skynet-contracts/src/calibration.rs

      # §45.3 and §45.4, the rule that keeps an expiry policy from switching itself off: a missing
      # *current* reading expires the record rather than extending it. A robot whose temperature
      # sensor has failed is precisely the robot whose F/T bias should not be trusted, and the
      # tempting `if let Some(current)` that skips the check on a missing input is how that gets
      # quietly inverted.
      - name: A missing reading expires a calibration rather than extending it
        run: |
          for reason in age joint_travel temperature; do
            grep -q "reason: \"$reason\"" crates/skynet-contracts/src/calibration.rs || {
              echo "::error::§45.4's $reason expiry is gone."
              exit 1
            }
          done
          grep -q 'fn a_missing_current_reading_expires_rather_than_extends' \
            crates/skynet-contracts/src/calibration.rs

      # §19. `skynet-ed25519` verifies; it signs only under `test-signing`, because signing
      # multiplies a secret scalar and the implementation is not constant-time. A robot holds public
      # keys and nothing else, so the signer must not be reachable from anything that ships — and
      # "must not" is a build property or it is a comment.
      #
      # The check walks each manifest section by section: naming the feature under
      # `[dev-dependencies]` is the supported arrangement, and naming it anywhere else puts a
      # non-constant-time signer into a binary that runs on a machine that can move.
      - name: The signer is not in anything that ships
        run: |
          fail=0
          for manifest in Cargo.toml crates/*/Cargo.toml; do
            offender=$(awk -v file="$manifest" '
              /^\[/ { section = $0 }
              /test-signing/ {
                if (section !~ /dev-dependencies/ && section !~ /^\[features\]/) {
                  print file ":" NR ": " $0
                }
              }
            ' "$manifest")
            if [ -n "$offender" ]; then
              echo "::error::$offender"
              fail=1
            fi
          done
          if [ "$fail" = 1 ]; then
            echo '§19: the robot verifies signatures and never produces one. `test-signing` may be'
            echo 'named under [features] in skynet-ed25519 and under [dev-dependencies] anywhere;'
            echo 'a normal dependency puts a non-constant-time signer into a shipped binary.'
            exit 1
          fi
          # And the module itself stays behind the feature, from the other side.
          grep -q '#\[cfg(feature = "test-signing")\]' crates/skynet-ed25519/src/lib.rs

      # The workspace has no third-party dependencies. A vendor building a driver in 2036 should be
      # able to build this with no network, and the kernel cannot reach most of the ecosystem
      # anyway.
      - name: No third-party dependencies
        run: |
          # Cargo.lock is the resolved graph, so this catches a transitive dependency as readily as
          # a direct one. Every package in it must be a workspace member, and the member list is
          # read from Cargo.toml rather than matched against a prefix — the prefix version of this
          # check reported `skynetd` as a third-party crate, because `skynetd` does not begin with
          # `skynet-`, and it had been failing since that crate landed.
          members=$(sed -n 's#^  "crates/\(.*\)",$#\1#p' Cargo.toml | sort)
          locked=$(sed -n 's#^name = "\(.*\)"$#\1#p' Cargo.lock | sort)
          if [ "$members" != "$locked" ]; then
            echo "::error::Cargo.lock does not hold exactly the workspace members."
            echo "The kernel is no_std without alloc and cannot reach most of the ecosystem; the"
            echo "rest of the workspace stays dependency-free so a vendor can build it with no network."
            echo "members:"; echo "$members" | sed 's/^/  /'
            echo "locked:";  echo "$locked"  | sed 's/^/  /'
            exit 1
          fi
