# Skynet OS — continuous integration.
#
# Four jobs, and the third is the one that matters. §31.4 requires differential checking in CI:
# every edition runs the corpus on every commit, and a divergence blocks the release of the edition
# that diverged and never of the others. There are two editions now, and `corpus` runs both — the
# reference and the Python edition §31.3's matrix puts at the guest ceiling. The second is
# incomplete and its runner reports that as a number, which is what makes it safe to gate on.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The Rust reference edition. No third-party dependencies anywhere in the workspace, so there is
  # nothing to cache and nothing to audit — which is a property worth keeping.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace

      # The daemon, against the machine rather than against a model. `skynetd-io`'s suite proves
      # the store and the reconciler over a temporary directory; this proves the pieces fit: a
      # package is staged, verified, activated through a symlink, launched as a transient systemd
      # unit under its declared cgroup limits, and driven through a Unix socket by the CLI.
      #
      # The launch step needs a systemd manager. Where there is one the run is *required* to reach
      # it, so a runner that quietly lost systemd fails the job rather than passing a shorter exam —
      # which is the failure mode §15 spends a whole rule on, and which this repository has already
      # found in its own CI once.
      - name: The daemon, end to end
        run: |
          cargo build -p skynetd-io -p skynet-cli
          if systemd-run --user --unit=skynet-ci-probe --collect /bin/true 2>/dev/null; then
            echo "a user systemd manager is here; the launch step is required to run"
            export SKYNET_REQUIRE_SYSTEMD=1
          else
            echo "::warning::no user systemd manager on this runner — the launch step will be reported as not run"
          fi
          SKYNET_BIN=target/debug sh crates/skynetd-io/e2e.sh

      # The kernel builds for a bare-metal target with no operating system under it. This is the
      # certified tier's argument made mechanical: one source, two targets, and if the kernel ever
      # acquires a dependency on `std` or an allocator, this is where it is caught rather than in a
      # safety review a year later.
      - name: Kernel builds for a safety MCU
        run: |
          rustup target add thumbv7em-none-eabihf
          # The ring and the capture split beside it. Neither runs on the safety MCU — the command
          # path and the sensor pipeline are both on the application processor — but both are
          # `no_std` with no `alloc` for the same reason the kernel is, and this is the check that
          # says so. A ring that quietly acquired a `Vec` would be an allocation on the one path
          # §25 says never touches an allocator, `skynet-capture` sits in the same cycle for §47.4's
          # reasons, and nothing else in the workspace would have noticed either.
          cargo build -p skynet-kernel -p skynet-ring -p skynet-capture --target thumbv7em-none-eabihf

  # The same workspace on the other platform, and it exists because of a break only this job would
  # have caught. §57 recorded that a lint result is only as broad as the target it ran on, after
  # clippy on Windows was clean while Linux had two warnings in `cfg(unix)` code. The complement was
  # left open and cost a red tree: `install_skill` is `cfg(unix)` because §37.1's activation needs an
  # atomic symlink swap, two of its four callers were not, and the workspace stopped **compiling**
  # its tests on Windows. Every job above runs on Linux, where those callers and their helper are
  # both present, so nothing failed.
  #
  # A test build is only as broad as the target it ran on, which is the sharper half of §57's rule,
  # because a lint warns and a missing `cfg` does not build at all.
  #
  # What this job deliberately does not do is run the daemon end to end or the corpus. Neither is
  # platform-specific — the daemon's launch needs a systemd manager and the corpus is bytes — so
  # repeating them here would double a cost for no coverage. What is Windows-only is which code
  # exists: `cfg` boundaries, path handling, and the five crates that carry `cfg(unix)`.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      # `--all-targets` so tests, benches and examples are built rather than only the libraries —
      # which is the exact scope the break lived in: `cargo build` was fine and `cargo test` was not.
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  # The vendor-facing ABI. A driver author reads these headers before deciding whether the platform
  # is worth an afternoon, so they must compile cleanly from both C and C++.
  abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mock robot, sim conformance
        working-directory: drivers/mock
        run: make check
      - name: The C++ wrapper still compiles
        working-directory: drivers/mock
        run: make cpp-header-check

      # The Python binding is the third view of the same ABI (§31.2). Its ctypes structs assert the
      # same offsets the Rust crate and the mock assert from their side, so a layout that moves
      # fails three suites rather than making one robot behave oddly.
      - name: The Python ABI view matches the header
        run: PYTHONPATH=bindings/python python3 -c "import skynet_rhal; skynet_rhal.assert_abi_layout()"

      # The LeRobot bridge, against its fake. This is the whole of what can be verified without the
      # library installed, and the harness says so on every run rather than implying more.
      - name: LeRobot bridge, sim conformance
        working-directory: drivers/lerobot
        run: make check PYTHON=python3
      # The C header is the ABI. Anything that stops it being includable from plain C99 — a C11-only
      # construct, a compiler extension — narrows who can implement a driver.
      - name: The C header is C99-includable
        run: |
          printf '#include "skynet_rhal.h"\nint main(void){return 0;}\n' > /tmp/c99.c
          cc -std=c99 -Wall -Wextra -Wpedantic -Ibindings/c -o /tmp/c99 /tmp/c99.c

      # §63.5's first milestone, measured rather than asserted: a fresh scaffold compiles clean,
      # loads through dlopen, and reaches guest tier with exactly the two blockers its own README
      # names. It lives here rather than in the `rust` job because it needs a C compiler, and it is
      # `#[ignore]`d by default so that running it is a scheduling decision rather than a silent
      # skip on a machine that happens to lack one.
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - name: A fresh scaffold builds, loads and reaches guest tier
        run: cargo test -p skynet-cli -- --ignored --nocapture

      # The control loop, against a driver that is really a shared object (§25). `src/tests.rs`
      # drives it against arrays, which covers the decisions and none of the ABI: a body reached
      # through dlopen, a vtable checked at load, three caller-allocated arrays a stranger's C
      # fills, and a write_command that returns an errno. Same reason as the step above for living
      # in this job and being `#[ignore]`d — it needs a C compiler, and a silent skip is the
      # failure §15 spends a rule on.
      - name: The control loop turns against the mock robot
        run: cargo test -p skynet-kernel-host -- --ignored --nocapture

      # The whole Python path, end to end and on the POSIX side of the host — which is the half that
      # cannot be exercised on the machine it was written on. `skynet driver check` dlopens the C
      # host, which forks an interpreter, which serves the LeRobot bridge over a pipe.
      - name: A Python driver loads through the host and reaches guest tier
        working-directory: drivers/python-host
        run: make check PYTHON=python3

      # The MuJoCo simulator driver (§70), against real physics. `libosmesa6` is the software GL
      # implementation that makes the camera path exercisable on a machine with no display; without
      # it the driver correctly declares no sensors, which is a real branch and a weaker test.
      - name: MuJoCo
        run: |
          python3 -m pip install --quiet mujoco
          sudo apt-get update -qq && sudo apt-get install -y -qq libosmesa6
      - name: MuJoCo driver, sim conformance against physics
        working-directory: drivers/mujoco
        run: MUJOCO_GL=osmesa make check PYTHON=python3
      - name: And the same driver through the C host
        working-directory: drivers/python-host
        run: MUJOCO_GL=osmesa make check-mujoco PYTHON=python3

  # The corpus, and the property that makes multiple editions survivable.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal

      # Regenerating must be a no-op. If it is not, the reference implementation's behaviour changed
      # without the corpus being updated in the same commit — which is precisely the state §31.4
      # forbids, because it means the editions are being measured against a stale specification.
      - name: The corpus is up to date with the reference
        run: |
          node tools/corpus-gen/generate.ts
          git diff --exit-code --stat corpus/ || {
            echo "::error::The reference implementation's behaviour changed and corpus/ was not regenerated."
            echo "Run: node tools/corpus-gen/generate.ts, and review the diff as the specification change it is."
            exit 1
          }

      # Every edition sits the same exam. Two rows now, and the second is not a smaller version
      # of the first: the Python edition is **incomplete**, and the whole design of its runner is
      # about saying so in a number rather than in a comment. It passes when every case it answers
      # is byte-identical and reports the rest as not implemented — so this step goes red on a
      # divergence and stays green on a gap, which is the only arrangement under which a partial
      # edition can be in CI at all.
      - name: Rust edition reproduces the corpus
        run: cargo test -p skynet-corpus -- --nocapture

      # `--min-passed` is the ratchet, and it is here rather than in the runner's default because
      # the number is a fact about history rather than about the code. Everything else this runner
      # checks has a floor of zero: an edition whose handler was deleted answers nothing, fails
      # nothing, and exits 0, because the cases move into the *not implemented* bucket — the one
      # that reads as honest progress. Raise it when the edition grows; lowering it is a decision
      # somebody makes in a diff rather than something that happens quietly.
      - name: Python edition reproduces the corpus
        run: python3 editions/python/run_corpus.py --min-passed 1109

      # The traps the corpus structurally cannot reach, and the checks on the runner itself.
      # Two kinds in one script, and both are here for the same reason: a case carrying a `1` where
      # the reference declares a boolean is a case no typed edition can represent, and a corpus
      # generator that writes through `JSON.stringify` cannot write an infinity at all. Neither
      # absence is a gap in the corpus, and neither is a reason to leave the branch unchecked.
      - name: The Python edition's own checks
        run: python3 editions/python/self_check.py

      # The published figure, held to the run that produces it. This is the last step in the job
      # rather than a separate one because it is the only check here that needs **both** editions
      # to have run: it runs them again and compares the result to `reference/reports/editions.json`,
      # which the Hub mirrors and `/skynet/os/editions` renders to the public.
      #
      # It is here because on 2026-09-07 that file said 1,137 cases while both editions passed
      # 1,142, and nothing in this workflow could see it. Every neighbouring check passed honestly:
      # `check-contract-mirrors` compares the Hub's copy to the reference's and both were stale
      # together, and `--min-passed 1109` is a floor that 1,137 and 1,142 both clear. A ratchet
      # cannot catch a stale exact figure — only re-deriving it can — and the number was published
      # on a page for as long as nobody happened to run this tool by hand.
      - name: The published edition figures are what running the editions produces
        run: node tools/edition-report.mjs --check

  # Claims this repository makes about itself, checked mechanically. Each of these is a sentence
  # somewhere in the specification that would otherwise decay quietly.
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # §32.2. The console's script is `include_str!`'d, which means Rust sees a string: a missing
      # brace compiles, ships, serves with a 200, and produces a blank page on a robot with every
      # test in `console.rs` still green. This is the only check that can catch it, and a blank
      # console is a robot whose stop button is gone.
      - name: The console's script parses
        run: node --check crates/skynetd-io/console/console.js

      - name: The console fixture's server parses
        run: node --check crates/skynetd-io/console/fixture-serve.mjs

      # §31.4 makes the reference TypeScript the oracle every edition is measured against, and
      # until this step existed nothing checked its types. Node 23 and later *strip* types rather
      # than checking them, so the generator ran happily against an oracle importing a type its own
      # `types.ts` did not export. The Hub type-checks its copies of the ten mirrored contracts and
      # nothing else, which left `kinematics.ts`, `blackbox.ts`, `shape.ts`, `skill.ts` and the
      # generator outside every check in either repository.
      #
      # Installed rather than committed, so a checkout still has no `node_modules` and running the
      # oracle still needs nothing. See `tsconfig.json`.
      - name: The reference oracle type-checks
        run: |
          npm install --no-save --no-audit --no-fund typescript @types/node
          npx tsc -p .

      # §72.1 splits the code and does not split the specification, and §31.4 makes the reference
      # TypeScript the oracle every edition is measured against.
      #
      # These two used to be no-ops here. BotMarket is not checked out beside this one, so both
      # printed "not found" and exited zero — a job named after a check that could not fail, and the
      # one divergence the contract tool has caught was caught by a human running it locally.
      #
      # They are real now with a single checkout. Each tool pins the digests of what it guards —
      # `docs/mirror-digests.json` and `reference/typescript/mirror-digests.json`, both written by
      # `--sync` from copies the two repositories agreed on — and verifies them when the Hub is
      # absent. What that catches is the direction that matters: a shared document or a mirrored
      # contract edited **here** without the other repository being brought along. The comparison
      # itself still needs both trees and still runs for anybody who has them.
      #
      # The contract check exists because the docs stayed in sync for thirteen sessions while
      # `lib/skynet/os/safety.ts` fell six behind, and nothing could see it: the corpus holds the
      # Rust edition and the reference to each other, and the Hub's copies are outside it.
      - name: The shared documents and contracts have not diverged
        run: |
          node tools/check-mirrors.mjs
          node tools/check-contract-mirrors.mjs

      # §73's closing paragraph is the first quantitative thing a vendor reads, and it has now been
      # wrong three times — most recently saying eighteen crates against twenty and one edition
      # against two, in the same section whose own preamble is an essay about a table going stale.
      # Three is enough to stop calling it carelessness. The numbers have a source now, and this is
      # the check that the source and the sentence still agree. It is deliberately exact about
      # counts anybody could recount and rounded to the nearest thousand about line counts, so a
      # reflow or a hundred new lines does not fail a build.
      - name: The specification still states the size of the thing it specifies
        run: node tools/scale-report.mjs --check

      # §31.2 keeps the RHAL ABI single-source, and three mechanisms already enforce that for
      # struct *layout*. Nothing enforced it for the flag *values*, which are written in four
      # places — and the fourth cannot be removed, because the job above asserts `skynetd-io` has
      # no edge to `skynet-rhal` (§33.1) and it therefore restates the bits it reads. A wrong mask
      # does not crash: it reads a different field, so a homing field overlapping SKR_FLAG_BRAKED
      # would put "ready to command" on the console of a robot whose brakes are on, with both
      # halves looking correct in isolation.
      - name: §24's flag values agree in all four places they are written
        run: node tools/check-rhal-flags.mjs

      # §65 promises that a vendor engineer reaches a moving robot without reading Parts II
      # through VII, and that "if they cannot, the fault is in the golden path rather than in
      # their patience." That is a promise about a document, and a document is the thing here with
      # no compiler behind it: a path moves, a `make` target is renamed, a CLI subcommand is folded
      # into another, and the README keeps saying what it said — confidently, to somebody with no
      # way to tell it is wrong. Nothing else in this workflow reads a README.
      - name: The golden path still describes this repository
        run: node tools/check-golden-path.mjs

      # §7.4. The sentence the product is not allowed to shorten. It lives in the kernel as a
      # constant, and a surface that mentions the certified tier without it is a surface making a
      # claim nobody sanctioned.
      - name: The safety claim rule is intact
        run: |
          grep -q "It does not certify a machine" crates/skynet-kernel/src/lib.rs
          grep -q "performed by a notified" crates/skynet-kernel/src/lib.rs

      # §8.3. A policy is always sandboxed — no flag, no override. An escape hatch here would
      # quietly undo the invariant the whole safety argument rests on.
      - name: Only a driver may run native
        run: grep -q 'manifest.kind != "driver" && manifest.isolation == "native"' crates/skynet-contracts/src/admission.rs

      # §23.1. "This never allocates" is a compile-time property or it is a promise, and a promise
      # is what code review produces on a good day.
      - name: The kernel links no allocator
        run: |
          grep -q '#!\[no_std\]' crates/skynet-kernel/src/lib.rs
          ! grep -q 'extern crate alloc' crates/skynet-kernel/src/lib.rs

      # §63.4. The line the URDF importer exists to hold: a URDF effort limit is a design value from
      # a CAD model, not a datasheet safety rating, and no flag may turn one into the other. The
      # rule is a property of the code rather than of a default, so the check is that the emitter
      # writes a literal null and nothing else can reach the field.
      - name: A generated descriptor never carries an envelope
        run: |
          grep -q '\.set("envelope", Json::Null)' crates/skynet-urdf/src/descriptor.rs
          if grep -n 'set("envelope"' crates/skynet-urdf/src/descriptor.rs | grep -v 'Json::Null'; then
            echo "::error::skynet-urdf writes an envelope from somewhere other than a literal null."
            echo "§63.4: a URDF carries design values, not sourced safety ratings. Populating the"
            echo "envelope from a model figure is the 'invent a plausible number' failure the whole"
            echo "design exists to prevent."
            exit 1
          fi

      # §35.3 and §70. A simulator declares itself one, and the declaration has to *do* something
      # or it is a comment. The cap lives in the contracts and in the CLI's tier walk, and the
      # corpus holds both to the oracle's answers; this is the check that the rule was not quietly
      # removed from either place while the corpus cases were removed with it.
      - name: A simulated body is capped at guest
        run: |
          grep -q 'input.simulator && (best == "host" || best == "certified")' \
            crates/skynet-contracts/src/certification.rs
          grep -q 'self.simulated && tier_rank(attained) > tier_rank("guest")' \
            crates/skynet-cli/src/check.rs

      # §23.1 again, from the other side. Two crates cannot be safe by construction: `skynet-rhal`
      # declares a C vtable of raw function pointers, and `skynet-cli` loads arbitrary native code.
      # Every other crate can be, and stays that way.
      #
      # `skynet-ring` is the one worth pausing over, because a lock-free structure shared between two
      # processes is the obvious place for that list to lose a member. It does not: the shared region
      # is modelled as `&[AtomicU32]`, which has interior mutability, so both ends read and write it
      # with the memory model spelling out what each observes and with no `unsafe` anywhere. What
      # genuinely needs it — turning an `mmap` into that slice — is one call, and it belongs to the
      # mapping layer rather than to the protocol. The protocol is the part where a mistake is a
      # moving robot, and it is the part the compiler checks.
      - name: Everything but the ABI, the loader and the three syscall crates forbids unsafe
        run: |
          # An allow-list of the six, and every *other* crate in the workspace is required to
          # forbid it — enumerated from the directory rather than from a list kept beside it, so the
          # check covers the next crate somebody adds instead of the ones somebody remembered. The
          # previous version listed the crates that must forbid it, which is the same check with the
          # default pointing the wrong way: a new crate joined the workspace unwatched.
          allowed="skynet-rhal skynet-cli skynet-dl skynet-ring-shm skynet-claim skynet-statfs"

          # A crate's root is `src/lib.rs`, or `src/main.rs` for one that is only a binary. Written
          # out because the version before this one looked only for `lib.rs`, and `skynet-cli` does
          # not have one — so the loop below reported the CLI as an allow-listed crate containing no
          # `unsafe`, when what was true is that the check was reading a file that does not exist.
          # A check that cannot pass is worth no more than one that cannot fail.
          root() {
            if [ -f "crates/$1/src/lib.rs" ]; then echo "crates/$1/src/lib.rs"
            else echo "crates/$1/src/main.rs"; fi
          }

          for path in crates/*/; do
            crate=$(basename "$path")
            case " $allowed " in *" $crate "*) continue ;; esac
            # The **attribute**, anchored, rather than the string anywhere in the file. A doc
            # comment that mentions `#![forbid(unsafe_code)]` — to explain why some *other* crate
            # has it — satisfied the unanchored version, and `skynet-statfs` is the crate that
            # found it: its header explains that `skynetd-io` forbids unsafe, which is why the
            # syscall lives in a crate of its own, and that sentence would have passed it off as a
            # crate with no unsafe in it. A check a comment can satisfy is a check about comments.
            grep -qE '^#!\[forbid\(unsafe_code\)\]' "$(root "$crate")" || {
              echo "::error::crates/$crate does not forbid(unsafe_code), and is not one of: $allowed"
              echo "§23.1. If it genuinely cannot be safe, say so here and say why in its crate docs."
              exit 1
            }
          done

          # And the six are each allowed for one stated reason, so the reason has to still be
          # written down. The two mappings are the smallest: `skynet-ring-shm` is four `extern "C"`
          # declarations, one mmap and one `from_raw_parts`, deliberately split from the protocol in
          # `skynet-ring` so that a reviewer asking whether the command path is memory-safe reads a
          # short file — and `skynet-claim` is §26.2's shared sequence, five declarations and one
          # `AtomicU64::from_ptr`, split from `skynet-lock` for the same reason.
          #
          # `skynet-statfs` is the sixth: §33.6's free-disk measurement and §80's floor, one
          # `statfs` read into `[u64; 15]` rather than a libc struct whose layout is glibc's, and
          # every reading checked before it is returned because the number authorises deleting a
          # sealed recording.
          #
          # `skynet-dl` joined this list late, and the reason is worth keeping: it was added to the
          # workspace after this check was written and the check has never run, so nothing caught
          # it. §73 already calls it "the loader `unsafe`, extracted so it has one home and two
          # callers" — the same argument `skynet-cli` is here for, in the crate that now holds it.
          for crate in $allowed; do
            grep -q 'unsafe' "$(root "$crate")" || {
              echo "::error::crates/$crate is on the unsafe allow-list and its root file does not"
              echo "mention unsafe. Either it no longer needs to be there, or the argument for it"
              echo "has left the crate header, which is the one place a reviewer looks first."
              exit 1
            }
          done

      # A sentence with a hole in it.
      #
      # Rust joins a string across lines with a trailing backslash, which also eats the next line's
      # indentation. Lose the backslash and the indentation stays: the compiler is happy, every test
      # passes, and an operator reads `...has no Hub to send to.              §10's pairing...`.
      #
      # It has happened three times in this repository — twice in one session, in an MCAP channel
      # schema and in a console message, and once before that in the sentence a robot prints when it
      # cannot issue a credential, where it went unnoticed for four sessions. The corpus caught one
      # because it compares two editions' schema bytes; the console caught another because somebody
      # looked at the page. Nothing was watching for the third.
      #
      # Long literals only, and not the ones with embedded JSON: a short string may legitimately
      # align a column of CLI output, and a test fixture may pretty-print an object.
      - name: No string literal has a hole punched in it
        run: |
          # `-o`, so the space test is applied to the **literal** and not to the source line. The
          # first version of this check matched a line's own indentation and fired on forty
          # perfectly good sentences, which is the shape of check somebody switches off.
          #
          # `grep -o` still prints `path:line:` in front of each match, so a failure names where to
          # look.
          if grep -rnoE '"[^"]{80,}"' --include='*.rs' crates/ \
             | grep -vF '\"' \
             | grep -E '[^ ] {10,}[^ ]'; then
            echo "::error::a string literal contains a run of spaces where a line continuation was."
            echo "Rust's trailing backslash joins the lines *and* eats the next line's indentation."
            echo "Without it the indentation ends up inside the sentence somebody reads."
            exit 1
          fi

      # §33.1. `skynetd` is not safety-critical and is built that way: it never touches an
      # actuator, and that single property is what licenses it to be a large, allocating,
      # network-facing program. A dependency edge to the hardware abstraction layer is the first
      # step in quietly acquiring the ability to write a joint, so the edge is asserted absent
      # rather than remembered absent.
      - name: skynetd cannot reach the RHAL
        run: |
          # Both halves. §33.1 is a property of the *daemon*: "it never touches an actuator" stops
          # being true the moment either crate can, and the I/O half is the one that can actually
          # open things.
          #
          # A dependency *line*, not the word: both manifests explain at length why the edge
          # is absent, and a check that a comment saying "not skynet-rhal" trips is a check
          # that punishes writing the reason down.
          # `skynet-blackbox` is in the list because `skynetd-io` depends on it, and a transitive
          # edge reaches an actuator exactly as well as a direct one. The black box records
          # `rhal_state` (§26), so the crate that declares those structs is the obvious dependency
          # to take and the one that would quietly restore what §33.1 removed.
          for crate in skynetd skynetd-io skynet-blackbox; do
            if grep -qE '^[[:space:]]*skynet-rhal[[:space:]]*=' "crates/$crate/Cargo.toml"; then
              echo "::error::$crate took a dependency on skynet-rhal."
              echo "§33.1: skynetd is not safety-critical *because* it never touches an actuator."
              echo "Everything else in §33 — the reconciler, the network exposure, the JSON parser —"
              echo "is licensed by that property, and this edge is how it would be lost."
              exit 1
            fi
            # The identifier in *code*, not in prose. The manifests and the modules explain at
            # length why the edge is absent, and a check that trips on a comment saying "not
            # skynet-rhal" is a check that punishes writing the reason down — which is how the
            # reason stops being written down.
            if grep -rnE 'skynet_rhal' "crates/$crate/src/" | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|[*])'; then
              echo "::error::$crate names skynet_rhal outside a comment."
              exit 1
            fi
          done

      # §33.3's two claims — converges from any starting state, idempotent — are properties of a
      # *function*. They are only assertable because `skynetd` is pure, so the purity is asserted
      # rather than remembered: the brain does not read a clock, open a socket, spawn a process or
      # touch the filesystem. Everything that does lives in `skynetd-io`.
      - name: The reconciler stays a pure function
        run: |
          if grep -rnE 'std::(fs|net|process|thread)|SystemTime|Instant::now|std::os::' crates/skynetd/src/; then
            echo "::error::skynetd reached for I/O."
            echo "§33.3 claims the reconciler converges from any starting state and is idempotent."
            echo "Those are properties of a function; about a program that also talks to systemd"
            echo "they are a hope. The I/O half is crates/skynetd-io."
            exit 1
          fi

      # §13 and §41.1. The black box's guarantee is completeness, and the shape of that guarantee is
      # that a window with a hole in it *says so* rather than being refused. Sealing an incomplete
      # recording must stay possible: the recording most likely to have a hole in it is the one
      # covering the fault that made the hole, and refusing to produce it would destroy the only
      # evidence at the moment it is worth something.
      - name: An incomplete recording is still sealed, and still says it is incomplete
        run: |
          grep -q 'pub fn complete' crates/skynet-blackbox/src/seal.rs
          if grep -nE 'return .*(Err|None).*incomplete|if !continuity.complete\(\)' \
              crates/skynet-blackbox/src/seal.rs; then
            echo "::error::seal() grew a path that refuses an incomplete window."
            echo "§41.1: the guarantee is 'complete, or the run is not conformant' — which is a"
            echo "statement about conformance, not a licence to withhold the evidence."
            exit 1
          fi

      # §10 and §13, the same rule twice. An attestation with a hole in it is still produced, for
      # the reason an incomplete recording is still sealed: the report most likely to have a hole in
      # it is the one covering whatever made the hole. A check-in withheld because a digest could
      # not be read is a robot the fleet believes is *offline*, which converts a named gap into a
      # silence nobody can tell from a dead machine.
      #
      # Written as "this function has no failure mode" rather than as a behaviour, because the
      # change that would take it away is somebody making `attest` fallible in a refactor and
      # threading a `?` through the callers — which reads like tightening and is the whole loss.
      - name: An attestation with a hole in it is still reported
        run: |
          grep -q 'pub fn attest' crates/skynet-contracts/src/identity.rs
          if grep -nE 'pub fn attest\(.*\) -> (Option|Result)' \
              crates/skynet-contracts/src/identity.rs; then
            echo "::error::attest() grew a failure mode."
            echo "§10 asks for a sentence saying what a robot is running, and the robot that most"
            echo "needs one is the robot that cannot measure all three digests. An unmeasured field"
            echo "is rendered as the hole it is; it is not a reason to withhold the report."
            exit 1
          fi

      # §19's `security.credential.scope`, from the direction it would be lost rather than by
      # asserting the behaviour. The rule is an **allow-list**: a device credential may carry the
      # capabilities §17 gives a device and nothing else, and anything unrecognised is refused.
      #
      # A deny-list is the reasonable-looking change that removes it. Somebody adds a Hub scope, the
      # allow-list refuses it, and the obvious fix is to invert the test and refuse only §19's three
      # named phrases — at which point a credential that spells repository read any other way walks
      # through, on the one credential §19 says is *assumed lost*. The corpus proves two editions
      # agree about the vocabulary and says nothing about the direction of the test, so the
      # direction is checked here.
      - name: A device credential's scopes are an allow-list
        run: |
          grep -q 'pub const DEVICE_SCOPES' crates/skynet-contracts/src/identity.rs
          grep -q '!DEVICE_SCOPES.contains(&scope.as_str())' \
            crates/skynet-contracts/src/identity.rs
          if grep -nE 'FORBIDDEN_SCOPES|DENIED_SCOPES|BLOCKED_SCOPES' \
              crates/skynet-contracts/src/identity.rs; then
            echo "::error::the scope check acquired a deny-list."
            echo "§19: a device credential is assumed lost. A deny-list is got past by a credential"
            echo "that spells the capability any other way, which is every attacker and no honest"
            echo "publisher. The allow-list refuses the spelling nobody anticipated."
            exit 1
          fi

      # §10 and §34.2, and the one thing this work had to get right rather than merely write down.
      # The pairing code and the device credential are both bearer secrets, and
      # `/proc/<pid>/cmdline` is world-readable on Linux — so neither may ever be an argument to the
      # `curl` that carries an exchange. The credential goes into curl's own config on **stdin**
      # (`--config -`) and the request body goes into a file passed by path, which is not a secret.
      #
      # The failure this guards is not a bug somebody would notice. `-H "Authorization: Bearer $t"`
      # works, passes every test in the suite, and publishes the credential to every local user for
      # the length of one request.
      #
      # The last check is the one that keeps the other three worth having: **only one function in
      # this daemon spawns curl.** Two callers with the same rule is two places for the rule to be
      # lost, and the second one is always written by somebody copying the first.
      - name: No secret reaches a command line
        run: |
          grep -q 'pub fn post_json' crates/skynetd-io/src/connectivity.rs
          grep -q '"--config"' crates/skynetd-io/src/connectivity.rs

          if grep -nE '"-H"|"--header"' crates/skynetd-io/src/connectivity.rs \
              | grep -i authorization; then
            echo "::error::a credential is passed to curl as an argument."
            echo "/proc/<pid>/cmdline is world-readable. The credential belongs in curl's own"
            echo "config on stdin: --config -, with a `header =` line."
            exit 1
          fi

          if grep -nE '"--data"|"--data-raw"|"--data-ascii"' \
              crates/skynetd-io/src/connectivity.rs; then
            echo "::error::a request body is passed to curl as an argument."
            echo "A body can be a sealed black box, and a pairing body contains the code. It goes"
            echo "in a file: --data-binary @<path>."
            exit 1
          fi

          if grep -rn 'Command::new("curl")' crates/skynetd-io/src/ \
              | grep -v 'connectivity\.rs'; then
            echo "::error::something other than connectivity::post_json spawns curl."
            echo "One caller, so the rule above lives in one place. A second one is written by"
            echo "somebody copying the first, and copies the shape rather than the reason."
            exit 1
          fi

      # §11, and the rule the pull module exists for: **decode before you write.** A version that
      # wrote the response and let §33.8's ladder sort it out afterwards would work almost always and
      # would be wrong in the one case that matters — a Hub, a captive portal or a proxy returning
      # something that is not a desired state would overwrite a good one, and the robot would fall
      # back to last-known-good on the next boot having silently lost the intent it was reconciling
      # against.
      #
      # Checked by line order, because that is what the rule is: the assessment happens before the
      # write, and the write is guarded by it. A refactor that moved the write earlier would pass
      # every test in the suite, because every test asserts the file's *contents* rather than when
      # they were decided.
      - name: A pulled desired state is decoded before it is written
        run: |
          file=crates/skynetd-io/src/intent.rs
          grep -q 'if verdict.adopt && verdict.changed' "$file"
          assess=$(grep -n 'let verdict = assess_offer' "$file" | head -1 | cut -d: -f1)
          write=$(grep -n 'write_atomic(&layout.desired()' "$file" | head -1 | cut -d: -f1)
          if [ -z "$assess" ] || [ -z "$write" ] || [ "$assess" -ge "$write" ]; then
            echo "::error::the desired state is written before §11 has assessed it."
            echo "§33.8 is a recovery ladder, not a licence to write first. A response that is not a"
            echo "desired state must never become the file the robot reconciles against."
            exit 1
          fi

      # §11: "no control decision may require a network round trip." A `GET` on the local API that
      # reached out to a Hub would be one — and would let anyone holding an observer credential make
      # this robot talk to the internet. The reconcile loop pulls; the route reports what it did.
      - name: Reading the intent does not pull
        run: |
          if grep -nE '(intent|releases)::pull' crates/skynetd-io/src/api.rs; then
            echo "::error::a local API route pulls from the Hub."
            echo "§11 keeps the network out of the control path, and §33.7's routes are read by"
            echo "anyone on the LAN with an observer credential. The reconcile loop is what pulls."
            echo "For /releases there is a second cost: the request carries the device credential"
            echo "and the catalogue is fetched over whatever bearer is up, so a GET that pulled"
            echo "would let an observer spend a fleet's metered allowance a request at a time."
            exit 1
          fi

      # §12's third rule binds a bench pass to the digest of the bytes it was taken against —
      # "evidence that is not bound to what it is evidence of is not evidence". A release manifest
      # is the other half of that binding: it says what those bytes change. So a manifest already on
      # disk is never replaced under its own version, and the check is for the *refusal*, because
      # the edit that loses it is somebody making the pull idempotent by writing unconditionally.
      - name: A release manifest is not rewritten under its own version
        run: |
          grep -q 'different manifest for release' crates/skynetd-io/src/releases.rs || {
            echo "::error::the release pull no longer refuses a changed manifest."
            echo "§12 binds a bench pass to the bytes it was taken against. A release that changes"
            echo "under one version has the robot judging an update against a description of some"
            echo "other image — and it looks right from every surface."
            exit 1
          }
          grep -q 'fn a_release_that_changed_under_its_version_is_refused'             crates/skynetd-io/src/releases.rs

      # Every curl this daemon spawns has a config channel on stdin, which is where the credential
      # goes. Counted rather than asserted once, because the failure is a *second* call site written
      # without one — which is what happened to the pairing exchange before it was moved into
      # `post_json`, and would have happened again to the pull.
      - name: Every curl gets its credential on stdin
        run: |
          file=crates/skynetd-io/src/connectivity.rs
          spawns=$(grep -c 'Command::new("curl")' "$file")
          configs=$(grep -c '"--config"' "$file")
          if [ "$spawns" != "$configs" ]; then
            echo "::error::$spawns curl call(s) and $configs config channel(s) in $file."
            echo "A curl without --config - has nowhere to put the credential except an argument,"
            echo "and /proc/<pid>/cmdline is world-readable."
            exit 1
          fi

      # §17's rule, on the one field it lives on: "the platform never claims a robot is running
      # something it has not heard from." A check-in reports the generation the robot has **applied**
      # and never the one it was asked for — a check-in echoing the desired generation would mark
      # every deployment applied the moment the robot heard about it.
      #
      # The change that breaks it looks like a fix: a fleet console shows a robot as behind, somebody
      # traces it to the check-in, and the obvious edit is to report the number the Hub sent.
      - name: A check-in reports the generation the robot applied
        run: |
          grep -q 'pub fn claim_for' crates/skynet-contracts/src/checkin.rs
          if grep -nE 'generation: desired' crates/skynet-contracts/src/checkin.rs; then
            echo "::error::a check-in reports the desired generation."
            echo "§17: a deployment is pending until a check-in, and the check-in is the only"
            echo "evidence the Hub has. Reporting the number it sent makes the field a mirror."
            exit 1
          fi

      # §34.4 collapses check-ins — "only the newest matters" — and that is safe only because every
      # field in one is a statement about **now**. A counter since the last check-in would make
      # collapsing lossy, and the queue would be discarding data while believing it was discarding
      # duplicates. Grepped for the shape rather than asserted, because the addition that breaks it
      # is one field somebody adds to make a dashboard nicer.
      - name: A check-in carries no history
        run: |
          # `-H` so a single-file grep still prints the name, which is what the comment filter
          # anchors on. Without it the filter silently matches nothing and the module's own header —
          # which contains the word this looks for — trips the check.
          if grep -nHEi 'since_last|_since_|delta_|history|events:' \
              crates/skynet-contracts/src/checkin.rs \
              | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|///|/\*|[*])'; then
            echo "::error::a check-in grew a field about the past."
            echo "§34.4 collapses check-ins because every field is a statement about now. A delta"
            echo "makes the collapse lossy, silently, and the queue reports it as a duplicate."
            exit 1
          fi

      # §10: "the Hub records not 'robot X is online' but 'robot X is running image `sha256:…`,
      # policy `sha256:…`, against body `sha256:…`' — which is the sentence an incident investigation
      # needs". The sentence is a rendering, and for two sessions it was the whole of what crossed:
      # `check_in_to_json` serialised `attest`'s report and dropped the three measures it was made
      # of, so the only route from the wire to a digest was a regular expression over prose that is
      # deliberately not machine-readable (`no policy`, `an unnamed body`).
      #
      # Grepped in both directions, because the edit that loses this is a revert to the shorter
      # function name and the shorter one still compiles, still passes every assertion about the
      # sentence, and still renders correctly on every console.
      - name: A check-in carries the three digests, not only the sentence
        run: |
          grep -q 'attestation_to_json(&built.attestation)' crates/skynet-contracts/src/checkin.rs
          for measure in os_image policy embodiment; do
            grep -q "\"$measure\"" crates/skynet-contracts/src/identity.rs || {
              echo "::error::attestation_to_json no longer carries $measure."
              exit 1
            }
          done
          if grep -n 'attestation_report_to_json(&attest(&built' crates/skynet-contracts/src/checkin.rs; then
            echo "::error::a check-in carries the sentence and not the digests."
            echo "§10 asks the Hub to record what a robot is running. A fleet console cannot index"
            echo "prose, and a digest that survives only inside a rendering is deleted by the next"
            echo "change to the rendering."
            exit 1
          fi

      # §10 again, from the other end of the same secret. The identity document is rendered by the
      # console, served by `GET /identity` and read by anything that wants to know whose this robot
      # is; the credential lives in a file of its own that one caller reads. A document that carried
      # the credential would be a bearer secret on a LAN listener, and the change that does it is
      # one field added to a JSON object by somebody making a check-in easier to write.
      - name: The identity document holds no credential
        run: |
          grep -q 'pub fn credential' crates/skynetd-io/src/layout.rs
          grep -q 'pub fn device' crates/skynetd-io/src/layout.rs
          if grep -nE 'set\("credential",' crates/skynetd-io/src/identity.rs; then
            echo "::error::the identity document grew a credential field."
            echo "§10: device.json is public to every surface this daemon has and the credential is"
            echo "not. They are two files on purpose."
            exit 1
          fi

      # §41.1's other half, from the direction it would actually be lost. The event vocabulary is a
      # closed enum so that ordinary logging cannot reach the black box; an open one — a free string
      # subject, a formatted message as a code — is how a recorder becomes a log file and the
      # completeness guarantee stops meaning anything.
      - name: The black box event vocabulary stays closed
        run: |
          grep -q 'pub enum EventCode' crates/skynet-blackbox/src/record.rs
          grep -q 'A closed enum rather than a free string' crates/skynet-blackbox/src/record.rs

      # §31.2 and §7.4. The kernel's sine, cosine and square root are the specification's, not the
      # platform's, and the whole certified-tier argument for mirroring this kernel onto a second
      # processor rests on that. A `use std::f64` or a call into a math library here would make two
      # editions — and the two channels of a redundant pair — disagree about a clamp, and the
      # disagreement would present as a specification dispute rather than as a build change.
      - name: The kernel computes its own transcendentals
        run: |
          grep -q 'pub fn sin' crates/skynet-kernel/src/real.rs
          grep -q 'pub fn cos' crates/skynet-kernel/src/real.rs
          grep -q 'pub fn sqrt' crates/skynet-kernel/src/real.rs
          if grep -rnE '\.(sin|cos|sqrt|tan|atan2|hypot)\(' crates/skynet-kernel/src/ \
              | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|[*])' \
              | grep -vE 'crates/skynet-kernel/src/real\.rs'; then
            echo "::error::the kernel reached for a platform math function."
            echo "§31.2: sin, cos and sqrt are single-source across editions. ECMAScript permits"
            echo "Math.sin an implementation-defined error and every libm rounds its own way, so a"
            echo "pose computed through one would diverge from a pose computed through another —"
            echo "including between the two channels of a certified-tier pair."
            exit 1
          fi
          # And the second edition implements the same routine rather than calling the platform's.
          if grep -nE 'Math\.(sin|cos|sqrt)\(' reference/typescript/kinematics.ts; then
            echo "::error::the reference edition called Math.sin, Math.cos or Math.sqrt."
            exit 1
          fi

      # §7.2, from the direction it would actually be lost. The pose guards ask the frame graph for
      # evidence — volumes that name reachable frames, two or more placeable collision shapes — and
      # never a descriptor's own claim that it has a collision model. A boolean is a claim, and a
      # guard reported as running because a document asserted it could is the most damaging form of
      # the failure §7.2 exists to prevent.
      - name: The pose guards ask for evidence and not for a claim
        run: |
          if grep -nE 'available\.(solvers|collision_model)' crates/skynet-kernel/src/lib.rs; then
            echo "::error::a pose guard is gated on a descriptor's self-assessment again."
            echo "§7.2: the frame graph is the evidence. `collision_model: true` with no geometry"
            echo "in it produced a guard reported as active that had nothing to evaluate, and"
            echo "`solvers` named an inverse-kinematics solver for a guard that does forward"
            echo "kinematics (§44.2)."
            exit 1
          fi
          grep -q 'embodiment.frames\[\].collision, on two or more frames' crates/skynet-kernel/src/lib.rs

      # §44.5. A frame below a ball or floating joint can never be placed from one scalar per joint,
      # and that is knowable when the lease is granted. Losing the static check turns "the guard
      # reported itself unavailable, naming the frame" into "the robot holds still every cycle for
      # the life of the lease" — the same outcome with the reason removed.
      - name: Unreachable frames are refused at lease time, not every cycle
        run: |
          grep -q 'pub fn statically_resolvable' crates/skynet-kernel/src/kinematics.rs
          grep -q 'statically_resolvable' crates/skynet-kernel/src/lib.rs

      # §31.4, and the lesson of this repository's own blind spot. Two of the eight guards were
      # implemented in one edition and absent from the other for four sessions, and nothing caught
      # it because no corpus *input* carried a capability token or a separation distance. A corpus
      # grows a hole wherever an input field is missing, not only where an implementation is.
      - name: Every guard the kernel implements appears in the corpus
        run: |
          for field in capability nearest_person_m; do
            grep -q "$field" corpus/fuzz/cycle.json || {
              echo "::error::no corpus case supplies $field, so the guard reading it is pinned by"
              echo "one edition's own suite and by nothing else — the arrangement §31.4 prevents."
              exit 1
            }
          done
          # Matched inside the `tripped` list of an expected verdict, not anywhere in the file:
          # `workspace` also names a profile setting in the *input*, and a check satisfied by the
          # question rather than by the answer is the shape of blind spot this step exists to close.
          for guard in workspace self_collision proximity mode_gate; do
            grep -rq "tripped[^]]*$guard" corpus/cycle/ || {
              echo "::error::no cycle case trips $guard."
              exit 1
            }
          done

      # §38.1, and the hole Ed25519 closed. The desired state is a file on the robot's own disk —
      # which is exactly where §38.1 puts the attacker, "somebody editing limits on a robot's disk"
      # — so a document that could assert its own `"verified": true` let anybody who could raise the
      # kernel's ceilings also raise the claim that somebody had checked them. The decoder must
      # never read that key; only a signature verified on the robot may set it.
      - name: A profile cannot assert its own verification
        run: |
          if grep -nE 'get\("verified"\)|string\(raw, "verified"\)' crates/skynetd/src/desired.rs; then
            echo "::error::the desired-state decoder read a `verified` key from the document."
            echo "§38.1: the interesting attacker is somebody editing limits on the robot's disk,"
            echo "and the desired state is on the robot's disk. The verdict is skynetd-io's, from"
            echo "the signature and the trust store, and never the document's own claim."
            exit 1
          fi
          grep -q 'fn verify_profile' crates/skynetd-io/src/runtime.rs

      # §19. "A driver runs native and must therefore be signed by a key the operator has trusted."
      # The gate is at activation, because a staged blob is inert and the symlink swap is the
      # consequential moment. Losing it would leave a report that says `signature_untrusted` next to
      # a robot that loaded the code anyway.
      - name: A driver does not activate without a trusted signature
        run: |
          grep -q 'fn driver_signature_refusal' crates/skynetd-io/src/runtime.rs
          grep -q 'driver_signature_refusal' crates/skynetd-io/src/runtime.rs
          # The refusal is reached from the activation arm, not merely defined.
          grep -A4 'ActionKind::ActivatePackage' crates/skynetd-io/src/runtime.rs \
            | grep -q 'driver_signature_refusal' || {
              echo "::error::ActivatePackage no longer consults §19's driver signature gate."
              exit 1
            }

      # §38.3. The trust store is written back by `skynetd trust`, and a rewrite that dropped what
      # it could not parse would make adding a key a way to delete the entry somebody is trying to
      # find. The store therefore keeps every unusable line verbatim and re-emits it in place.
      - name: A trust store rewrite preserves what it could not parse
        run: |
          grep -q 'raw: entry.clone()' crates/skynetd-io/src/trust.rs
          grep -A6 'pub fn to_json' crates/skynetd-io/src/trust.rs \
            | grep -q 'Entry::Skipped(skipped) => skipped.raw.clone()' || {
              echo "::error::TrustStore::to_json no longer re-emits skipped entries."
              echo "§38.3: an audited surface that silently drops a malformed key turns"
              echo "\`skynetd trust add\` into a way to lose one."
              exit 1
            }

      # §38.3, the other half: provenance is *recorded*, never inferred. A key added without
      # `--by` records nobody rather than whatever `\$USER` happens to say, because an environment
      # variable is not an identity and a confidently wrong provenance is worse than an absent one.
      - name: Provenance is never guessed from the environment
        run: |
          if grep -rnE 'env::var\("(USER|SUDO_USER|LOGNAME|USERNAME)"\)' crates/skynetd-io/src/; then
            echo "::error::something read a username out of the environment for an audit record."
            echo "§38.3 wants who and when. A name nobody typed is a provenance nobody wrote."
            exit 1
          fi
          grep -q '"unattributed"' crates/skynetd-io/src/main.rs

      # §32.2. The console has to render on a phone held next to a robot, and `main` is a grid:
      # a grid item's default `min-width: auto` means one wide table sets the width of every panel
      # beside it, which is how a page that looked fine on a laptop pushed 378 px off the right
      # edge of a phone — with the *status* panel among the things hanging over it. A page that
      # scrolls sideways puts the stop button's own row off screen.
      - name: The console cannot be widened by one panel
        run: |
          grep -q 'main > \* { min-width: 0; }' crates/skynetd-io/console/console.css
          grep -q 'overflow-x: auto' crates/skynetd-io/console/console.css

      # §48.2. A check that could not run has not passed. The self-test has four outcomes and only
      # one of them is a licence: `may_run` is true when **every** check passed, and a refactor that
      # counted `unavailable` or `elsewhere` as "not a failure, therefore fine" would produce a
      # robot cleared to run a policy on the strength of three checks out of eight.
      - name: A self-test that could not run is not a self-test that passed
        run: |
          grep -A4 'pub fn may_run' crates/skynetd-io/src/post.rs \
            | grep -q 'check.outcome == Outcome::Pass' || {
              echo "::error::POST's may_run no longer requires every check to have passed."
              echo "§48.2: an unavailable check establishes nothing, and a check §33.1 forbids this"
              echo "process from running has not been run by anybody it can ask."
              exit 1
            }
          # And the two verdicts stay apart: SAFE is sticky and needs a human, incomplete does not.
          grep -q '"post_incomplete"' crates/skynetd-io/src/post.rs
          grep -q 'fn an_undeclared_window_leaves_post_incomplete_rather_than_failed' \
            crates/skynetd-io/src/tests.rs

      # §46.2, and the shape of the rule is what a refactor would flatten. A tier ladder normally
      # caps downward; here the **middle rung is the unsafe one**. A body whose drives coast may be
      # guest (enforcement is advisory) and may be certified (layer 4 cuts drive enable
      # independently of the reset), and only host — where layer 3 is the last line and its recovery
      # is resetting the processor — turns a watchdog reset into a fall. Rewriting this as a ceiling
      # would silently permit exactly the configuration it exists to refuse.
      - name: A coasting body is refused host and nothing else
        run: |
          grep -q 'fn host_blocked_by_command_loss' crates/skynet-contracts/src/watchdog.rs
          grep -q 'Some("coast") => Some' crates/skynet-contracts/src/watchdog.rs
          # Silence is not `hold`: an undeclared behaviour blocks host too.
          grep -A3 'None => Some(' crates/skynet-contracts/src/watchdog.rs \
            | grep -q 'does not declare what its drives do' || {
              echo "::error::an undeclared on_command_loss no longer blocks the host tier."
              echo "§46.2: silence is a recovery path nobody has characterised, not \`hold\`."
              exit 1
            }
          grep -q 'fn a_coasting_body_is_refused_host_and_nothing_else' \
            crates/skynet-contracts/src/watchdog.rs

      # §46.3. Two watchdogs with the same window is a race decided by interrupt latency, and a
      # chain whose order depends on which timer fires first is not a chain. The comparison is
      # strict, and an undeclared window is reported rather than skipped — a nesting report that
      # ignored the window it could not get would be reporting on a chain it had not established.
      - name: The watchdog windows nest strictly
        run: |
          grep -q 'if inner < outer {' crates/skynet-contracts/src/watchdog.rs
          grep -q 'fn equal_windows_do_not_nest' crates/skynet-contracts/src/watchdog.rs
          grep -q 'fn a_gap_is_reported_and_skipped_over_rather_than_ending_the_check' \
            crates/skynet-contracts/src/watchdog.rs

      # §34.4. An incident is never dropped, which is only true if there is somewhere to put it —
      # so the budget is split and the reserve is untouchable. The two ways this silently breaks
      # are an incident drawing on the shared pool (it would then be evictable in practice) and
      # `victim()` being allowed to evict upwards, which would let a flood of telemetry take out
      # the incident it is supposed to make room beside.
      - name: An incident is never dropped to make room
        run: |
          grep -q 'fn droppable' crates/skynetd-io/src/outbound.rs
          grep -q 'self != Class::Incident' crates/skynetd-io/src/outbound.rs
          # The eviction candidate must be at least as droppable as the item asking for room.
          grep -q 'item.class.droppable() && item.class >= class' crates/skynetd-io/src/outbound.rs
          grep -q 'fn an_incident_fits_into_a_queue_that_is_otherwise_full' \
            crates/skynetd-io/src/outbound.rs
          grep -q 'fn telemetry_never_evicts_an_episode' crates/skynetd-io/src/outbound.rs

      # §34.4's jitter, which only does its job in the full form. `exponential ± 10%` leaves a
      # hundred robots that lost the same access point retrying inside the same tenth of a window —
      # the thundering herd smeared rather than broken up. The delay must be uniform over
      # [0, exponential], and the cap must survive a jitter nobody clamped.
      - name: Backoff jitter is full and the cap holds
        run: |
          grep -q 'jitter.clamp(0.0, 1.0)' crates/skynetd-io/src/outbound.rs
          grep -q 'min(BACKOFF_CAP_MS)' crates/skynetd-io/src/outbound.rs
          grep -q 'backoff_ms(12, 4.0), BACKOFF_CAP_MS' crates/skynetd-io/src/outbound.rs

      # §45.5. An expired calibration disables its dependent guards **by name**. The naming is the
      # whole requirement: "proximity unavailable" sends nobody anywhere, and "proximity
      # unavailable: the camera_extrinsics calibration expired" sends them to a target board. The
      # table that maps a parameter set to the guards it feeds is §45.2's deliverable, and a guard
      # spelled wrongly in it disables nothing while reading as though it disabled something.
      - name: Every calibrated parameter set names real guards
        run: |
          grep -q 'fn the_guard_table_names_only_guards_the_kernel_has' \
            crates/skynet-contracts/src/calibration.rs
          # Absence is not validity: a set nobody measured takes its guards with it.
          grep -q 'None => Validity::Absent' crates/skynet-contracts/src/calibration.rs

      # §45.3 and §45.4, the rule that keeps an expiry policy from switching itself off: a missing
      # *current* reading expires the record rather than extending it. A robot whose temperature
      # sensor has failed is precisely the robot whose F/T bias should not be trusted, and the
      # tempting `if let Some(current)` that skips the check on a missing input is how that gets
      # quietly inverted.
      - name: A missing reading expires a calibration rather than extending it
        run: |
          for reason in age joint_travel temperature; do
            grep -q "reason: \"$reason\"" crates/skynet-contracts/src/calibration.rs || {
              echo "::error::§45.4's $reason expiry is gone."
              exit 1
            }
          done
          grep -q 'fn a_missing_current_reading_expires_rather_than_extends' \
            crates/skynet-contracts/src/calibration.rs

      # §19. `skynet-ed25519` verifies; it signs only under `test-signing`, because signing
      # multiplies a secret scalar and the implementation is not constant-time. A robot holds public
      # keys and nothing else, so the signer must not be reachable from anything that ships — and
      # "must not" is a build property or it is a comment.
      #
      # The check walks each manifest section by section: naming the feature under
      # `[dev-dependencies]` is the supported arrangement, and naming it anywhere else puts a
      # non-constant-time signer into a binary that runs on a machine that can move.
      - name: The signer is not in anything that ships
        run: |
          fail=0
          for manifest in Cargo.toml crates/*/Cargo.toml; do
            offender=$(awk -v file="$manifest" '
              /^\[/ { section = $0 }
              /test-signing/ {
                if (section !~ /dev-dependencies/ && section !~ /^\[features\]/) {
                  print file ":" NR ": " $0
                }
              }
            ' "$manifest")
            if [ -n "$offender" ]; then
              echo "::error::$offender"
              fail=1
            fi
          done
          if [ "$fail" = 1 ]; then
            echo '§19: the robot verifies signatures and never produces one. `test-signing` may be'
            echo 'named under [features] in skynet-ed25519 and under [dev-dependencies] anywhere;'
            echo 'a normal dependency puts a non-constant-time signer into a shipped binary.'
            exit 1
          fi
          # And the module itself stays behind the feature, from the other side.
          grep -q '#\[cfg(feature = "test-signing")\]' crates/skynet-ed25519/src/lib.rs

      # §54.3. "A skill that judges its own success is a skill that always succeeds — and on a
      # platform where success rates feed a marketplace, self-reported outcomes are worth nothing."
      #
      # The runtime is allowed to record `aborted`, because that is a *lifecycle* fact — the skill
      # was refused, timed out, lost a precondition, or the robot stopped — and §54.4 is where it
      # comes from. It is not allowed to construct a `success` or a `failure`, because those are
      # §54.3's and come out of `judge_success` over post-state. A literal here would be the runtime
      # deciding an outcome it is not entitled to, which is the one thing this section exists to
      # prevent and would look entirely reasonable in a diff.
      - name: The runtime never decides a skill succeeded
        run: |
          if grep -nE 'SkillOutcome::(Success|Failure)' crates/skynetd-io/src/skill.rs; then
            echo "::error::the skill runtime named a success or a failure directly."
            echo "§54.3: the OS judges over post-state, through judge_success. A runtime that can"
            echo "write the word is a runtime that can be talked into writing it by the skill."
            exit 1
          fi
          grep -q 'judge_success' crates/skynetd-io/src/skill.rs

      # §54.4 asks the episode to carry an intervention count, and this edition has no source for
      # one: §33.1 keeps the daemon off the actuator path, so nothing counts. A zero would be
      # consumed by a marketplace as evidence of a clean run.
      #
      # The switch is asserted present rather than the absence asserted, because the failure mode is
      # somebody deleting the `Option` to make a field always appear — which is a one-line change
      # that makes every episode claim a number nobody measured.
      - name: An intervention count is absent rather than zero
        run: |
          grep -q 'pub guards_observable: bool' crates/skynetd-io/src/skill.rs
          grep -q 'interventions: Option<u32>' crates/skynetd-io/src/skill.rs
          if grep -nE 'intervention_count.*Json::Num\(0' crates/skynetd-io/src/skill.rs; then
            echo "::error::an episode reported an intervention count of zero."
            echo "§33.1: nothing on this robot counts interventions, so the honest episode omits"
            echo "the field. A zero is a number a marketplace reads as a clean run."
            exit 1
          fi

      # §54.2's first rule, from the direction it would actually be lost. "A precondition that
      # cannot be evaluated refuses the skill, naming the path that was unresolvable" — which only
      # works if an unknown fact is *absent* from the context. A `null` under one of these paths
      # resolves, so the clause is answered instead of refused, and a robot with no battery sensor
      # starts every skill that asked about its battery.
      - name: The live context has no nulls in it
        run: |
          if grep -n 'Json::Null' crates/skynet-contracts/src/live.rs; then
            echo "::error::the live precondition context can emit a null."
            echo "§54.2: absent and null are different answers. An absent path refuses the clause"
            echo "that named it; a null resolves, and the skill runs on a fact nobody measured."
            exit 1
          fi

      # §12's third rule, which the specification calls "the single most important test in the
      # suite": an update that changes the Safety Kernel or the envelope is refused without a fresh
      # bench pass. Two halves of it are one line each to remove and neither would look wrong.
      #
      # The first is that an **unrecognised** component is gated. A publisher shipping a kernel
      # change past the gate would not write `safety_kernel`, they would write `core` or `rt`, and a
      # matcher that only knew the two named words would wave it through.
      #
      # The second is that a bench pass is bound to a **digest**. A gate that accepted "this robot
      # has passed a bench test at some point" is satisfied by every robot the gate exists to
      # protect.
      - name: OTA is not a route around certification
        run: |
          grep -q 'CERTIFICATION_GATED' crates/skynet-contracts/src/ota.rs
          if ! grep -q '!OS_COMPONENTS.contains(&component)' crates/skynet-contracts/src/ota.rs; then
            echo "::error::an unrecognised component is no longer gated."
            echo "§12: the gate is got past by renaming, not by admitting. A component nobody can"
            echo "classify is one nobody has established is safe to change."
            exit 1
          fi
          if ! grep -q 'bench.image_digest != bundle.digest' crates/skynet-contracts/src/ota.rs; then
            echo "::error::a bench pass is no longer bound to the bundle it is evidence of."
            echo "§12: evidence that is not bound to what it is evidence of is not evidence, and a"
            echo "gate satisfied by any past pass is satisfied by every robot it protects."
            exit 1
          fi
          # And the same rule in the oracle, because the corpus only holds them to each other.
          grep -q 'OS_COMPONENTS as readonly string\[\]).includes(component)' reference/typescript/ota.ts

      # §12's second rule. A health check that could confirm a slot it had not been told about
      # replaces an unattended recovery with a race, so absence of evidence must never confirm.
      - name: A boot nobody has checked is never confirmed
        run: |
          grep -q 'post_passed: Option<bool>' crates/skynet-contracts/src/ota.rs
          if grep -nE 'post_passed.*unwrap_or\(true\)|packages_healthy.*unwrap_or\(true\)|converged.*unwrap_or\(true\)' \
              crates/skynet-contracts/src/ota.rs; then
            echo "::error::a boot health check defaults to passing."
            echo "§12: the new slot must *pass* a health check within a boot budget. A check that"
            echo "defaults to true confirms a slot on the strength of nobody having looked."
            exit 1
          fi

      # The workspace has no third-party dependencies. A vendor building a driver in 2036 should be
      # able to build this with no network, and the kernel cannot reach most of the ecosystem
      # anyway.
      - name: No third-party dependencies
        run: |
          # Cargo.lock is the resolved graph, so this catches a transitive dependency as readily as
          # a direct one. Every package in it must be a workspace member, and the member list is
          # read from Cargo.toml rather than matched against a prefix — the prefix version of this
          # check reported `skynetd` as a third-party crate, because `skynetd` does not begin with
          # `skynet-`, and it had been failing since that crate landed.
          members=$(sed -n 's#^  "crates/\(.*\)",$#\1#p' Cargo.toml | sort)
          locked=$(sed -n 's#^name = "\(.*\)"$#\1#p' Cargo.lock | sort)
          if [ "$members" != "$locked" ]; then
            echo "::error::Cargo.lock does not hold exactly the workspace members."
            echo "The kernel is no_std without alloc and cannot reach most of the ecosystem; the"
            echo "rest of the workspace stays dependency-free so a vendor can build it with no network."
            echo "members:"; echo "$members" | sed 's/^/  /'
            echo "locked:";  echo "$locked"  | sed 's/^/  /'
            exit 1
          fi
