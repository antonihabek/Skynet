name: Bug report
description: Something did not do what it says it does.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **A security or safety issue?** Do not file it here — use the Security tab → *Report a vulnerability*. See SECURITY.md.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what it printed, and what you expected instead. Paste errors as text, not screenshots.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest sequence of commands that shows it. If it happens on the virtual robot (`sudo ./packaging/virtual-robot.sh up`), say so — that is the easiest case for anyone to reproduce.
      placeholder: |
        1. sudo ./packaging/virtual-robot.sh up
        2. skynet ...
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: skynet version
      description: Output of `skynet version`.
      render: text
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where it ran
      options:
        - Virtual robot (drivers/mock)
        - Simulator (MuJoCo or another sim driver)
        - A real robot
        - Workstation only — no robot involved
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: e.g. Ubuntu 26.04 x86-64, Debian 13 aarch64, WSL2
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: skynet doctor
      description: If a robot is involved, run `skynet doctor --out bundle.json` and attach the file. Check it first — it describes the machine it came from.
