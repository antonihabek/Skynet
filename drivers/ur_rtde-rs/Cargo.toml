[package]
name = "skynet-ur-rtde-rs"
description = "A Universal Robots arm over RTDE, in Rust. A port of drivers/ur_rtde's Python driver (Phase 6, item 6.6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# cdylib, because the RHAL is a C ABI: the OS loads this with dlopen and looks up one symbol. rlib
# beside it, because a cdylib alone cannot run its own tests.
name = "skynet_ur_rtde_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The `#[repr(C)]` view of the same C header, not a second definition of it (§31.2).
skynet-rhal = { path = "../../crates/skynet-rhal" }
# The config JSON and the descriptor, in the workspace's one canonical form.
skynet-json = { path = "../../crates/skynet-json" }
# §35.1's clock, `skynet_rt::monotonic_raw_ns` — the one the stamp gate in CI names.
skynet-rt = { path = "../../crates/skynet-rt" }

[lints.rust]
missing_docs = "warn"
