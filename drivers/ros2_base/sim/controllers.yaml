# ros2_control's own configuration of a differential-drive base, as its documentation writes it (diff_drive_controller, ros2_controllers), with
# one change this repository makes on purpose: `enable_odom_tf: false`, so that no `tf2` is needed to run the check.
#
# `wheel_radius` and `wheel_separation` are read by `live.py` to say what the wheels should do for a velocity it asked for.
controller_manager:
  ros__parameters:
    update_rate: 100
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    wheel_separation: 0.40
    wheel_radius: 0.05
    odom_frame_id: odom
    base_frame_id: base_link
    publish_rate: 50.0
    open_loop: false
    enable_odom_tf: false
    cmd_vel_timeout: 0.5
