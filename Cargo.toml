# Skynet OS — the Rust reference edition.
#
# One workspace, twenty-two crates, and a deliberate absence: there are no third-party dependencies
# anywhere in it. That is not minimalism for its own sake. `skynet-kernel` is `#![no_std]` with no
# `alloc`, so most of the ecosystem is unavailable to it by construction; and §31.4 of the
# specification requires every edition to reproduce the conformance corpus *byte-identically*,
# which means the JSON number-formatting rule has to be ours rather than a dependency's. A vendor
# building a driver in 2036 should be able to `cargo build` this with no network.

[workspace]
resolver = "2"
members = [
  "crates/skynet-json",
  "crates/skynet-sha256",
  "crates/skynet-ed25519",
  "crates/skynet-rhal",
  "crates/skynet-dl",
  "crates/skynet-lock",
  "crates/skynet-claim",
  "crates/skynet-statfs",
  "crates/skynet-mdns",
  "crates/skynet-ring",
  "crates/skynet-obs",
  "crates/skynet-ring-shm",
  "crates/skynet-capture",
  "crates/skynet-kernel",
  "crates/skynet-kernel-host",
  "crates/skynet-policy-host",
  "crates/skynet-contracts",
  "crates/skynet-urdf",
  "crates/skynet-cli",
  "crates/skynet-blackbox",
  "crates/skynetd",
  "crates/skynetd-io",
  "crates/skynet-corpus",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/antonihabek/Skynet"
authors = ["Skynet OS contributors"]

[profile.release]
panic = "abort"
overflow-checks = true
