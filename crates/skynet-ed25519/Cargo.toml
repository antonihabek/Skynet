[package]
name = "skynet-ed25519"
description = "Ed25519 signature verification (RFC 8032), no_std and dependency-free. Verification only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Signing, for tests and for nothing else.
#
# The robot never signs: the Hub holds the release keys (§19) and `skynetd` holds only public ones.
# But a test that wants to prove the *verified* path works needs a signature over bytes it chose,
# and the alternative — pinning a handful of signatures generated by some other tool — would test
# the verifier against four fixed messages forever.
#
# It is behind a feature because signing touches a secret scalar and this implementation is **not
# constant-time** (see the crate docs). Under `resolver = "2"` a feature a dev-dependency turns on
# is not turned on for a normal build, so `cargo build -p skynetd-io` does not compile it. Anything
# that ships must not name it.
test-signing = []

[lints.rust]
missing_docs = "warn"

[dev-dependencies]
# This crate, depending on itself, to turn `test-signing` on for its own integration tests.
#
# Cargo allows a dev-dependency cycle back to the package under test, and it is the supported way
# to enable a feature for tests without enabling it for anything that ships: `cargo build` does not
# resolve dev-dependencies, so the signer is not in the daemon binary. `tests/signing.rs` links
# against this copy.
skynet-ed25519 = { path = ".", features = ["test-signing"] }
