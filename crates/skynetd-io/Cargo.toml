[package]
name = "skynetd-io"
description = "The I/O half of skynetd: the package store, the systemd launcher, observation, and the local API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "skynetd"
path = "src/main.rs"

[dependencies]
skynetd = { path = "../skynetd" }
skynet-contracts = { path = "../skynet-contracts" }
skynet-json = { path = "../skynet-json" }
skynet-lock = { path = "../skynet-lock" }
skynet-sha256 = { path = "../skynet-sha256" }
skynet-ed25519 = { path = "../skynet-ed25519" }
skynet-blackbox = { path = "../skynet-blackbox" }

# §82's responder half. The crate holds the wire format and what a robot may advertise; this crate
# holds the socket, which is §82.4's own split.
skynet-mdns = { path = "../skynet-mdns" }
skynet-rt = { path = "../skynet-rt" }

# §33.6's free-disk measurement and §80's floor, in a crate of its own because this one forbids
# `unsafe` and a `statfs` is one.
skynet-statfs = { path = "../skynet-statfs" }

# Deliberately **not** `skynet-rhal`, for the same reason `skynetd` is not — and it matters more
# here, because this is the half that can actually open things. §33.1's property is about the
# daemon, not about one of its crates: "it never touches an actuator" stops being true the moment
# either half can. CI asserts the edge is absent from both.

[dev-dependencies]
# The signer, for the tests that need a real signature over a digest they chose. See
# `skynet-ed25519`'s crate documentation: a robot verifies and never signs, and CI asserts this
# feature is named nowhere that ships.
skynet-ed25519 = { path = "../skynet-ed25519", features = ["test-signing"] }

[lints.rust]
missing_docs = "warn"
