[package]
name = "skynet-kernel-host"
description = "The process that owns the control loop: reads the RHAL, drives the Safety Kernel, and is the only writer to an actuator (§25)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "skynetk"
path = "src/main.rs"

[dependencies]
skynet-blackbox = { path = "../skynet-blackbox" }

# §47.4's split and §47.2's source shape. This process owns the driver, and §47.2's fourth backend is
# a sensor only the driver can reach, so the one capture loop that can read it is the one here.
skynet-capture = { path = "../skynet-capture" }

# So a sealed window can be written down beside the limits it was recorded under. `skynetk`
# resolves those limits and nothing else on the machine knows them: the daemon resolves its own
# from the descriptor and a transport plan, which on a bench are not what the loop ran with. A
# window whose ceilings nobody can state is a window nobody can replay.
skynet-contracts = { path = "../skynet-contracts" }
skynet-dl = { path = "../skynet-dl" }
skynet-json = { path = "../skynet-json" }

# §47.6's mapping half. Carried through the hand-off rather than created here: this process owns
# §25's rings because §25 says the runtime does, and it owns no camera.
skynet-frames = { path = "../skynet-frames" }


skynet-kernel = { path = "../skynet-kernel" }
skynet-lock = { path = "../skynet-lock" }
skynet-obs = { path = "../skynet-obs" }
skynet-rhal = { path = "../skynet-rhal" }
skynet-ring = { path = "../skynet-ring" }

# §23.5's per-process preconditions: lock the address space before the loop turns, and read
# whether the kernel is PREEMPT_RT. Reported, never refused — see `main.rs`, and the amendment
# that would change it.
skynet-rt = { path = "../skynet-rt" }

# §25's hand-off: the mapping this process creates and the descriptor a policy receives. The
# crate is the one place `mmap` and `SCM_RIGHTS` live, and on anything but Linux every function
# in it answers `Unsupported` rather than failing to compile.
skynet-ring-shm = { path = "../skynet-ring-shm" }

[lints.rust]
missing_docs = "warn"
