# No third-party dependencies, for `skynet-ring-shm`'s reason and with one more: this crate is the
# fourth `unsafe` in the workspace, and the argument for it being acceptable is that a reviewer can
# read the whole of it. A bindings crate would put three syscalls behind a dependency graph.

[lints.rust]
missing_docs = "warn"
