[package]
name = "skynet-statfs"
description = "How much of the volume under a path is free (§33.6, §80): one syscall, checked rather than trusted."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# No third-party dependencies, for `skynet-ring-shm`'s reason and with one more: this crate is the
# fifth `unsafe` in the workspace, and the argument for it being acceptable is that a reviewer can
# read the whole of it. A bindings crate would put one syscall behind a dependency graph.

[lints.rust]
missing_docs = "warn"
