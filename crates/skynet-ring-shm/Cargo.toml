[package]
name = "skynet-ring-shm"
description = "The memfd a §25 command ring is mapped over. The workspace's only unsafe outside the ABI and the loader."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
skynet-ring = { path = "../skynet-ring" }

# No third-party dependencies, here least of all. This crate exists to make four syscalls, and the
# usual way to reach them is a C bindings crate — which would be the first non-vendored dependency
# in a workspace whose absence of them is a property a vendor can check with `cargo build` and no
# network. Four `extern "C"` declarations cost less than that, and they are visible in the diff.

[lints.rust]
missing_docs = "warn"
