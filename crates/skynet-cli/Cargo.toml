[package]
name = "skynet-cli"
description = "The `skynet` workstation CLI: descriptor import, transport planning, driver scaffolding and local conformance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "skynet"
path = "src/main.rs"

[dependencies]
skynet-blackbox = { path = "../skynet-blackbox" }
skynet-contracts = { path = "../skynet-contracts" }
skynet-dl = { path = "../skynet-dl" }
skynet-json = { path = "../skynet-json" }
skynet-mdns = { path = "../skynet-mdns" }
skynet-rhal = { path = "../skynet-rhal" }
skynet-sha256 = { path = "../skynet-sha256" }
skynet-urdf = { path = "../skynet-urdf" }
skynetd-io = { path = "../skynetd-io" }

[lints.rust]
missing_docs = "warn"
